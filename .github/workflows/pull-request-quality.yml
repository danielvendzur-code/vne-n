name: Pull request quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply final brand contracts and assets
        run: python scripts/finalize-lime-white-brand.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed brand files
        run: |
          bunx prettier --write \
            scripts/security-audit.mjs \
            tests/home-contract.test.mjs \
            src/components/site/Nav.tsx \
            src/routes/__root.tsx \
            src/components/BrandMark.tsx \
            src/components/site/LimeWhiteBrandFinal.css

      - name: Run source and deployment security audit
        run: node scripts/security-audit.mjs

      - name: Lint source
        run: bun run lint

      - name: Run UX and deployment contracts
        run: bun run test

      - name: Build production server
        run: bun run build
        env:
          NITRO_PRESET: node-server
          VITE_BASE_PATH: /vne-n/

      - name: Commit validated finalization and restore normal CI
        shell: bash
        run: |
          rm -f scripts/finalize-lime-white-brand.py
          rm -f .github/workflows/finalize-lime-white-brand-once.yml
          git checkout origin/main -- .github/workflows/pull-request-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize the white forest lime identity'
          git push origin HEAD:${{ github.head_ref }}
