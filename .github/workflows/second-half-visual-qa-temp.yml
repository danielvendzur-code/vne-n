name: Temporary second-half visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start Vite
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for attempt in {1..50}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Install browser
        run: |
          bunx playwright@1.55.0 install --with-deps chromium
          bun add --no-save --dev @playwright/test@1.55.0
      - name: Render every section
        run: |
          cat > second-half-visual.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';

          async function openPage(page) {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1500);
          }

          async function captureSection(page, selector, path) {
            const section = page.locator(selector);
            await section.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1100);
            await section.screenshot({ path });
          }

          async function revealWholePage(page) {
            const max = await page.evaluate(() => document.documentElement.scrollHeight - innerHeight);
            for (let y = 0; y <= max; y += 420) {
              await page.evaluate((top) => scrollTo({ top, behavior: 'instant' }), y);
              await page.waitForTimeout(170);
            }
            await page.waitForTimeout(900);
          }

          test('desktop composition', async ({ page }) => {
            await page.setViewportSize({ width: 1600, height: 1000 });
            await openPage(page);
            await captureSection(page, '.derat-story', 'desktop-derat.png');
            await captureSection(page, '.lp-value', 'desktop-value.png');
            await captureSection(page, '.lp-portfolio', 'desktop-projects.png');
            await captureSection(page, '.lp-caps', 'desktop-capabilities.png');
            await captureSection(page, '.lp-faq', 'desktop-faq.png');
            await captureSection(page, '.lp-process', 'desktop-process.png');
            await revealWholePage(page);
            await page.evaluate(() => scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(900);
            await expect(page.locator('.lp-project')).toHaveCount(3);
            await page.screenshot({ path: 'desktop-full.png', fullPage: true });
          });

          test('mobile composition', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await openPage(page);
            await captureSection(page, '.derat-story', 'mobile-derat.png');
            await captureSection(page, '.lp-value', 'mobile-value.png');
            await captureSection(page, '.lp-portfolio', 'mobile-projects.png');
            await captureSection(page, '.lp-caps', 'mobile-capabilities.png');
            await captureSection(page, '.lp-faq', 'mobile-faq.png');
            await captureSection(page, '.lp-process', 'mobile-process.png');
            await revealWholePage(page);
            await page.evaluate(() => scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(900);
            await expect(page.locator('.lp-project')).toHaveCount(3);
            await page.screenshot({ path: 'mobile-full.png', fullPage: true });
          });
          EOF
          bunx playwright test second-half-visual.spec.ts --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: second-half-visual-qa
          path: |
            desktop-full.png
            desktop-derat.png
            desktop-value.png
            desktop-projects.png
            desktop-capabilities.png
            desktop-faq.png
            desktop-process.png
            mobile-full.png
            mobile-derat.png
            mobile-value.png
            mobile-projects.png
            mobile-capabilities.png
            mobile-faq.png
            mobile-process.png
