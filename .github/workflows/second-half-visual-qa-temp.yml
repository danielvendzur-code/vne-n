name: Temporary second-half visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start Vite
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for attempt in {1..50}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Install browser
        run: |
          bunx playwright@1.55.0 install --with-deps chromium
          bun add --no-save --dev @playwright/test@1.55.0
      - name: Render every section
        run: |
          cat > second-half-visual.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';

          async function revealWholePage(page) {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1500);
            await page.evaluate(async () => {
              const max = document.documentElement.scrollHeight - innerHeight;
              for (let y = 0; y <= max; y += Math.max(320, innerHeight * 0.58)) {
                scrollTo({ top: y, behavior: 'instant' });
                await new Promise((resolve) => setTimeout(resolve, 110));
              }
              scrollTo({ top: 0, behavior: 'instant' });
            });
            await page.waitForTimeout(1800);
          }

          test('desktop composition', async ({ page }) => {
            await page.setViewportSize({ width: 1600, height: 1000 });
            await revealWholePage(page);
            await expect(page.locator('.lp-project')).toHaveCount(3);
            await expect(page.locator('.lp-process')).toBeVisible();
            await page.screenshot({ path: 'desktop-full.png', fullPage: true });
            await page.locator('.derat-story').screenshot({ path: 'desktop-derat.png' });
            await page.locator('.lp-portfolio').screenshot({ path: 'desktop-projects.png' });
            await page.locator('.lp-caps').screenshot({ path: 'desktop-capabilities.png' });
          });

          test('mobile composition', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await revealWholePage(page);
            await expect(page.locator('.lp-project')).toHaveCount(3);
            await page.screenshot({ path: 'mobile-full.png', fullPage: true });
            await page.locator('.derat-story').screenshot({ path: 'mobile-derat.png' });
            await page.locator('.lp-caps').screenshot({ path: 'mobile-capabilities.png' });
          });
          EOF
          bunx playwright test second-half-visual.spec.ts --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: second-half-visual-qa
          path: |
            desktop-full.png
            desktop-derat.png
            desktop-projects.png
            desktop-capabilities.png
            mobile-full.png
            mobile-derat.png
            mobile-capabilities.png
