name: Team, legal and motion audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/team-legal-motion-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect personal-language and legal references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== PERSONAL / INDIVIDUAL LANGUAGE ==='
            grep -RInE --exclude-dir=node_modules --exclude='*.map' --exclude='routeTree.gen.ts' \
              'Daniel|Vendžúr|Vendzur|odpoviem|ozvem sa|napíšte mi|kontakt na mňa|so mnou|priamo so mnou|staviam|navrhnem|otestujem|prepojím|nasadím|spracúvam sám|údaje spracúvam|zbieram len|potrebujem|viem postaviť|môjho chatbota|Stačí mi|pripravím ja|Poviete mi' \
              src public || true
            echo
            echo '=== LEGAL / PRIVACY / ANALYTICS ==='
            grep -RInE --exclude-dir=node_modules --exclude='*.map' \
              'cookies|analytics|Vercel|Resend|osobn|GDPR|prevádzkovateľ|IČO|DIČ|EHP|Európsk' \
              src public package.json || true
            echo
            echo '=== PROCESS / MOTION SELECTORS ==='
            grep -RInE --exclude-dir=node_modules --exclude='*.map' \
              'lp-process|lp-timeline|lp-step|whileInView|useScroll|Reveal' \
              src/components/site src/hooks || true
          } > audit.txt
          cat audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: team-legal-motion-audit
          path: audit.txt
          retention-days: 1
