name: Dependency remediation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Apply audited dependency lockfiles')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Re-resolve and remediate Bun lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bun audit fix
          bun audit --prod --audit-level=high

      - name: Re-resolve and remediate npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Validate production candidate
        shell: bash
        run: |
          set -euo pipefail
          bun run lint
          bun run test
          NITRO_PRESET=vercel bun run build

      - name: Commit only audited lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json || {
            echo "Dependency tooling unexpectedly changed package.json; refusing automatic commit."
            git diff -- package.json
            exit 1
          }

          if git diff --quiet -- bun.lock package-lock.json; then
            echo "Lockfiles already match the audited dependency graph."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          git commit -m "Apply audited dependency lockfiles"
          git push origin HEAD:main
