name: Temporary orientation formatter

on:
  push:
    branches:
      - kage/refinement-2026-08-22

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kage/refinement-2026-08-22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply final orientation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/site/KageLanding.css')
          s = p.read_text()
          s = s.replace('@media (max-width: 1180px), (pointer: coarse) {', '@media (max-width: 1180px) {')
          s = s.replace(
              'font-size: clamp(3.85rem, 18.8vw, 5.7rem);\n    line-height: 0.82;',
              'font-size: clamp(3.7rem, 17.2vw, 5.35rem);\n    line-height: 0.82;'
          )
          marker = '  .kage-hero .hybrid-hero__collage {'
          if '  .kage-hero h1 em {\n    white-space: nowrap;\n  }\n\n' not in s:
              s = s.replace(marker, '  .kage-hero h1 em {\n    white-space: nowrap;\n  }\n\n' + marker)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/components/site/KageLanding.tsx src/components/site/KageLanding.css
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/KageLanding.tsx src/components/site/KageLanding.css
          git commit -m "Format orientation refinement"
          git push origin HEAD:kage/refinement-2026-08-22
