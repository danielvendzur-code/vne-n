name: Synchronize team copy contracts once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-team-copy-contracts-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update exact copy contracts and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['scripts/security-audit.mjs', 'tests/home-contract.test.mjs']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('Čo potrebujem od klienta', 'Čo potrebujeme od klienta')
              text = text.replace('čo od vás potrebujem', 'čo od vás potrebujeme')
              path.write_text(text, encoding='utf-8')
          PY
          node scripts/security-audit.mjs
          bun test
          bun run lint
          NITRO_PRESET=vercel bun run build
      - name: Remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/sync-team-copy-contracts-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/security-audit.mjs tests/home-contract.test.mjs .github/workflows/sync-team-copy-contracts-once.yml
          git commit -m 'test: align team-first copy contracts'
          git push origin HEAD:${{ github.head_ref }}
