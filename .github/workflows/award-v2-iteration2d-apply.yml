name: Apply award v2 iteration 2d

on:
  push:
    branches:
      - award/rebuild-v2-2026-08-23

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: award/rebuild-v2-2026-08-23
      - name: Refine orb placement
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/site/AwardV2Iteration2.css';
          let css = fs.readFileSync(path, 'utf8');
          const marker = '/* Orb placement polish — iteration 2d */';
          if (!css.includes(marker)) {
            css += `\n\n${marker}\n.award2-guide {\n  top: calc(var(--header-h) + 1.35rem);\n  transform: none;\n}\n\n.award2-guide__traveler small,\n.award2-guide[data-tone="light"] .award2-guide__traveler small {\n  top: 78px;\n  right: auto;\n  left: 50%;\n  transform: translateX(-50%);\n}\n`;
            fs.writeFileSync(path, css);
          }
          NODE
      - run: npx prettier --write src/components/site/AwardV2Iteration2.css
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/AwardV2Iteration2.css
          git commit -m "refine: scroll orb placement" || exit 0
          git push origin HEAD:award/rebuild-v2-2026-08-23
