name: Verify live visual layout

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect actual mojchatbot.sk computed layout
        shell: bash
        run: |
          cat > live-visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const results = [];

          async function inspect(viewport, label) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto(`https://mojchatbot.sk/?visual=${Date.now()}-${label}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await page.evaluate(() => document.fonts?.ready);
            await page.waitForTimeout(1200);

            const url = page.url();
            const rows = await page.locator('.hybrid-tool').evaluateAll((els) => els.map((row) => {
              const title = row.querySelector('strong');
              const benefit = row.querySelector('b');
              const copy = row.querySelector('p');
              const cta = row.querySelector('.hybrid-tool__cta');
              const rect = (el) => el ? el.getBoundingClientRect().toJSON() : null;
              const overlap = (a, b) => {
                if (!a || !b) return 0;
                const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
                const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
                return x * y;
              };
              const tr = title?.getBoundingClientRect();
              const br = benefit?.getBoundingClientRect();
              const pr = copy?.getBoundingClientRect();
              const cr = cta?.getBoundingClientRect();
              return {
                title: title?.textContent?.trim(),
                titleRect: rect(title),
                benefitRect: rect(benefit),
                copyRect: rect(copy),
                ctaRect: rect(cta),
                titleBenefitOverlap: overlap(tr, br),
                benefitCopyOverlap: overlap(br, pr),
                copyCtaOverlap: overlap(pr, cr),
                rowScrollWidth: row.scrollWidth,
                rowClientWidth: row.clientWidth,
              };
            }));

            const flow = await page.locator('.kage-flow').first().evaluate((el) => {
              const style = getComputedStyle(el);
              const rect = el.getBoundingClientRect();
              return {
                computedHeight: style.height,
                rectHeight: rect.height,
                viewportHeight: innerHeight,
                ratio: rect.height / innerHeight,
              };
            }).catch(() => null);

            const iframeInfo = await page.locator('iframe').evaluateAll((frames) => frames.map((f) => ({
              title: f.title,
              id: f.id,
              src: f.src,
              className: f.className,
              rect: f.getBoundingClientRect().toJSON(),
              background: getComputedStyle(f).backgroundColor,
              borderRadius: getComputedStyle(f).borderRadius,
            })));

            let launcher = null;
            for (const frame of page.frames()) {
              const candidate = frame.locator('.cw-launcher');
              if (await candidate.count()) {
                launcher = await candidate.first().evaluate((el) => {
                  const s = getComputedStyle(el);
                  const svg = el.querySelector('svg');
                  return {
                    frameUrl: location.href,
                    background: s.backgroundColor,
                    backgroundImage: s.backgroundImage,
                    boxShadow: s.boxShadow,
                    borderColor: s.borderColor,
                    borderRadius: s.borderRadius,
                    rect: el.getBoundingClientRect().toJSON(),
                    svgRect: svg?.getBoundingClientRect().toJSON() ?? null,
                  };
                });
                break;
              }
            }

            const bodyOverflow = await page.evaluate(() => ({
              innerWidth,
              innerHeight,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              bodyScrollWidth: document.body.scrollWidth,
            }));

            const shot = `live-${label}.png`;
            await page.screenshot({ path: shot, fullPage: true });
            results.push({ label, viewport, url, rows, flow, iframeInfo, launcher, bodyOverflow, shot });
            await page.close();
          }

          await inspect({ width: 1583, height: 900 }, 'desktop-1583');
          await inspect({ width: 390, height: 844 }, 'mobile-390');

          await browser.close();
          fs.writeFileSync('live-visual-results.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));

          const desktop = results.find((r) => r.label === 'desktop-1583');
          const failures = [];
          for (const row of desktop?.rows ?? []) {
            if (row.titleBenefitOverlap > 1) failures.push(`${row.title}: title overlaps benefit (${row.titleBenefitOverlap}px²)`);
            if (row.benefitCopyOverlap > 1) failures.push(`${row.title}: benefit overlaps copy (${row.benefitCopyOverlap}px²)`);
            if (row.copyCtaOverlap > 1) failures.push(`${row.title}: copy overlaps CTA (${row.copyCtaOverlap}px²)`);
            if (row.rowScrollWidth > row.rowClientWidth + 2) failures.push(`${row.title}: row horizontally overflows`);
          }
          if (desktop?.flow && desktop.flow.ratio < 4.2) failures.push(`Flow too short: ${desktop.flow.ratio.toFixed(2)}vh`);
          if (desktop?.launcher) {
            const bg = desktop.launcher.background.replace(/\s+/g, '');
            if (bg !== 'rgba(0,0,0,0)' && bg !== 'transparent') failures.push(`Launcher background is ${desktop.launcher.background}`);
            if (desktop.launcher.backgroundImage !== 'none') failures.push(`Launcher background-image is ${desktop.launcher.backgroundImage}`);
          } else {
            failures.push('Could not find .cw-launcher inside any live frame');
          }
          const mobile = results.find((r) => r.label === 'mobile-390');
          if (mobile && mobile.bodyOverflow.scrollWidth > mobile.bodyOverflow.clientWidth + 2) {
            failures.push(`Mobile horizontal overflow ${mobile.bodyOverflow.scrollWidth} > ${mobile.bodyOverflow.clientWidth}`);
          }

          if (failures.length) {
            console.error('\nVISUAL_FAILURES');
            failures.forEach((f) => console.error(`- ${f}`));
            process.exit(1);
          }
          console.log('\nLIVE_COMPUTED_VISUAL=success');
          JS
          node live-visual-check.mjs

      - name: Upload screenshots and computed metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-computed-visual-${{ github.run_id }}
          path: |
            live-desktop-1583.png
            live-mobile-390.png
            live-visual-results.json
          retention-days: 7
