name: Verify live visual layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-current-main
  cancel-in-progress: true

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect actual mojchatbot.sk computed layout
        shell: bash
        run: |
          cat > live-visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });

          async function inspect(viewport, label, attempt) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto(`https://mojchatbot.sk/?visual=${Date.now()}-${label}-${attempt}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await page.evaluate(() => document.fonts?.ready);
            await page.waitForTimeout(1200);

            const rows = await page.locator('.hybrid-tool').evaluateAll((els) => els.map((row) => {
              const title = row.querySelector('strong');
              const benefit = row.querySelector('b');
              const copy = row.querySelector('p');
              const cta = row.querySelector('.hybrid-tool__cta');
              const overlap = (a, b) => {
                if (!a || !b) return 0;
                const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
                const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
                return x * y;
              };
              const tr = title?.getBoundingClientRect();
              const br = benefit?.getBoundingClientRect();
              const pr = copy?.getBoundingClientRect();
              const cr = cta?.getBoundingClientRect();
              return {
                title: title?.textContent?.trim(),
                titleBenefitOverlap: overlap(tr, br),
                benefitCopyOverlap: overlap(br, pr),
                copyCtaOverlap: overlap(pr, cr),
                rowScrollWidth: row.scrollWidth,
                rowClientWidth: row.clientWidth,
              };
            }));

            const flow = await page.locator('#ako-to-funguje.plain-flow-story').first().evaluate((el) => {
              const rect = el.getBoundingClientRect();
              const style = getComputedStyle(el);
              return {
                rectHeight: rect.height,
                viewportHeight: innerHeight,
                ratio: rect.height / innerHeight,
                position: style.position,
                stepCount: el.querySelectorAll('.plain-flow-story__step').length,
                modeCount: el.querySelectorAll('.plain-flow-story__modes button').length,
              };
            }).catch(() => null);

            const legacyFlow = await page.locator('.kage-flow[data-flow-rescued="true"]').first().evaluate((el) => ({
              display: getComputedStyle(el).display,
              ariaHidden: el.getAttribute('aria-hidden'),
            })).catch(() => null);

            const outcomeHeading = await page.locator('.outcome-comparison__intro h2').first().evaluate((el) => ({
              lineHeight: getComputedStyle(el).lineHeight,
              fontSize: getComputedStyle(el).fontSize,
            })).catch(() => null);

            const cta = await page.locator('.site-header__cta').first().evaluate((el) => {
              const style = getComputedStyle(el);
              return {
                background: style.backgroundColor,
                color: style.color,
              };
            }).catch(() => null);

            let launcher = null;
            for (const frame of page.frames()) {
              const candidate = frame.locator('.cw-launcher');
              if (await candidate.count()) {
                launcher = await candidate.first().evaluate((el) => {
                  const s = getComputedStyle(el);
                  return {
                    background: s.backgroundColor,
                    backgroundImage: s.backgroundImage,
                    boxShadow: s.boxShadow,
                    borderColor: s.borderColor,
                    borderRadius: s.borderRadius,
                    backdropFilter: s.backdropFilter || s.webkitBackdropFilter || '',
                    rect: el.getBoundingClientRect().toJSON(),
                    hostVersion: document.getElementById('dv-assistant-root')?.getAttribute('data-dv-assistant-version') ?? null,
                  };
                });
                break;
              }
            }

            const geometry = await page.evaluate(() => ({
              innerWidth,
              innerHeight,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));

            const shot = `live-${label}.png`;
            await page.screenshot({ path: shot, fullPage: true });
            const result = { label, viewport, url: page.url(), rows, flow, legacyFlow, outcomeHeading, cta, launcher, geometry, shot };
            await page.close();
            return result;
          }

          let finalResults = null;
          let finalFailures = [];

          for (let attempt = 1; attempt <= 18; attempt += 1) {
            const desktop = await inspect({ width: 1583, height: 900 }, 'desktop-1583', attempt);
            const mobile = await inspect({ width: 390, height: 844 }, 'mobile-390', attempt);
            const failures = [];

            for (const row of desktop.rows) {
              if (row.titleBenefitOverlap > 1) failures.push(`${row.title}: title overlaps benefit`);
              if (row.benefitCopyOverlap > 1) failures.push(`${row.title}: benefit overlaps copy`);
              if (row.copyCtaOverlap > 1) failures.push(`${row.title}: copy overlaps CTA`);
              if (row.rowScrollWidth > row.rowClientWidth + 2) failures.push(`${row.title}: desktop row overflows`);
            }

            if (desktop.geometry.innerWidth !== 1583 || desktop.geometry.innerHeight !== 900) {
              failures.push(`desktop viewport is ${desktop.geometry.innerWidth}x${desktop.geometry.innerHeight}`);
            }
            if (mobile.geometry.innerWidth !== 390 || mobile.geometry.innerHeight !== 844) {
              failures.push(`mobile viewport is ${mobile.geometry.innerWidth}x${mobile.geometry.innerHeight}`);
            }

            const checkFlow = (result, label) => {
              if (!result.flow) {
                failures.push(`${label} plain flow missing`);
                return;
              }
              if (result.flow.stepCount !== 4) failures.push(`${label} flow step count ${result.flow.stepCount}`);
              if (result.flow.modeCount !== 3) failures.push(`${label} flow mode count ${result.flow.modeCount}`);
              if (['fixed', 'sticky'].includes(result.flow.position)) failures.push(`${label} flow unexpectedly ${result.flow.position}`);
              if (result.flow.ratio < 1.6) failures.push(`${label} flow too short: ${result.flow.ratio.toFixed(2)} viewport heights`);
              if (!result.legacyFlow || result.legacyFlow.display !== 'none' || result.legacyFlow.ariaHidden !== 'true') {
                failures.push(`${label} legacy snapping flow is not fully hidden`);
              }
            };

            checkFlow(desktop, 'desktop');
            checkFlow(mobile, 'mobile');

            const checkHeading = (result, label) => {
              if (!result.outcomeHeading) {
                failures.push(`${label} outcome heading missing`);
                return;
              }
              const lineHeight = Number.parseFloat(result.outcomeHeading.lineHeight);
              const fontSize = Number.parseFloat(result.outcomeHeading.fontSize);
              if (!(lineHeight >= fontSize * 1.04)) {
                failures.push(`${label} heading leading too tight: ${lineHeight}/${fontSize}`);
              }
            };

            checkHeading(desktop, 'desktop');
            checkHeading(mobile, 'mobile');

            const checkCta = (result, label) => {
              if (!result.cta) {
                failures.push(`${label} header CTA missing`);
                return;
              }
              if (result.cta.background !== 'rgb(200, 240, 106)') {
                failures.push(`${label} CTA background ${result.cta.background}`);
              }
              if (result.cta.color !== 'rgb(7, 27, 21)') {
                failures.push(`${label} CTA color ${result.cta.color}`);
              }
            };

            checkCta(desktop, 'desktop');
            checkCta(mobile, 'mobile');

            const checkLauncher = (launcher, label) => {
              if (!launcher) {
                failures.push(`${label} launcher missing`);
                return;
              }
              if (launcher.background !== 'rgb(255, 255, 255)') failures.push(`${label} launcher background ${launcher.background}`);
              if (launcher.backgroundImage !== 'none') failures.push(`${label} launcher background-image ${launcher.backgroundImage}`);
              if (launcher.borderRadius !== '50%') failures.push(`${label} launcher radius ${launcher.borderRadius}`);
              if (launcher.backdropFilter && launcher.backdropFilter !== 'none') failures.push(`${label} launcher backdrop-filter ${launcher.backdropFilter}`);
              if (launcher.hostVersion !== 'premium-motion-20260829-v14') failures.push(`${label} widget version ${launcher.hostVersion}`);
            };

            checkLauncher(desktop.launcher, 'desktop');
            checkLauncher(mobile.launcher, 'mobile');

            if (mobile.geometry.scrollWidth > mobile.geometry.clientWidth + 2) {
              failures.push(`mobile horizontal overflow ${mobile.geometry.scrollWidth} > ${mobile.geometry.clientWidth}`);
            }

            finalResults = [desktop, mobile];
            finalFailures = failures;
            fs.writeFileSync('live-visual-results.json', JSON.stringify({ attempt, results: finalResults, failures }, null, 2));
            console.log(JSON.stringify({ attempt, results: finalResults, failures }, null, 2));

            if (!failures.length) {
              console.log('\nLIVE_COMPUTED_VISUAL=success');
              await browser.close();
              process.exit(0);
            }

            console.error(`Attempt ${attempt}/18 failed: ${failures.join('; ')}`);
            if (attempt < 18) await new Promise((resolve) => setTimeout(resolve, 10000));
          }

          await browser.close();
          console.error('\nVISUAL_FAILURES');
          finalFailures.forEach((failure) => console.error(`- ${failure}`));
          process.exit(1);
          JS
          node live-visual-check.mjs

      - name: Upload screenshots and computed metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-computed-visual-${{ github.run_id }}
          path: |
            live-desktop-1583.png
            live-mobile-390.png
            live-visual-results.json
          retention-days: 7
