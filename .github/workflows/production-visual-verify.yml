name: Verify live visual layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-current-main
  cancel-in-progress: true

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait until this exact SHA is live
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            body="$(curl --location --fail --silent --show-error --header 'Cache-Control: no-cache' \
              "https://mojchatbot.sk/build-meta.json?visual=${SOURCE_SHA}-${attempt}" || true)"
            if printf '%s' "$body" | grep -Fq "$SOURCE_SHA"; then
              echo "Verified live SHA: $SOURCE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for $SOURCE_SHA on mojchatbot.sk"
          exit 1

      - name: Inspect current visual and functional rules
        shell: bash
        run: |
          cat > live-visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('visual-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const results = [];
          const cleanText = (value) => (value || '').replace(/\s+/g, ' ').trim();

          const overlapArea = (a, b) => {
            if (!a || !b) return 0;
            const x = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
            const y = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
            return x * y;
          };

          async function dismissAnalytics(page) {
            const banner = page.locator('.analytics-consent');
            if (!(await banner.count())) return;
            const reject = banner.getByRole('button', { name: /Odmietnuť analytiku/i });
            if (await reject.count()) {
              await reject.click();
              await banner.waitFor({ state: 'detached', timeout: 4000 }).catch(() => {});
            }
          }

          async function openPage(path, viewport, label) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`https://mojchatbot.sk${path}?visual=${Date.now()}-${label}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await page.evaluate(() => document.fonts?.ready);
            await dismissAnalytics(page);
            await page.waitForTimeout(500);
            return page;
          }

          async function noOverflow(page, label) {
            const size = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            if (size.scrollWidth > size.clientWidth + 3) {
              throw new Error(`${label} horizontal overflow ${size.scrollWidth}/${size.clientWidth}`);
            }
          }

          async function shot(page, name, fullPage = true) {
            await page.screenshot({ path: `visual-artifacts/${name}.png`, fullPage });
          }

          async function run(name, fn) {
            try {
              await fn();
              results.push({ name, status: 'passed' });
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              failures.push(`${name}: ${message}`);
              results.push({ name, status: 'failed', message });
            }
          }

          async function checkNavigation(page, mobile) {
            const header = page.locator('.site-header');
            if (!(await header.count()) || !(await header.isVisible())) throw new Error('site header missing');

            if (mobile) {
              const toggle = page.locator('.site-menu-toggle');
              if (!(await toggle.count()) || !(await toggle.isVisible())) throw new Error('mobile menu toggle missing');
              await toggle.click();
              const layer = page.locator('.site-menu-layer[data-open="true"]');
              await layer.waitFor({ state: 'visible', timeout: 3000 });
              if ((await layer.locator('.site-menu-nav a').count()) < 4) throw new Error('mobile menu links missing');
              const close = layer.locator('.site-menu-close');
              if (await close.count()) await close.click();
              return;
            }

            const links = page.locator('.site-nav a');
            if ((await links.count()) < 4) throw new Error('desktop navigation links missing');
            const pseudo = await links.evaluateAll((items) =>
              items.map((item) => ({
                before: getComputedStyle(item, '::before').display,
                after: getComputedStyle(item, '::after').display,
              })),
            );
            if (pseudo.some((item) => item.before !== 'none' || item.after !== 'none')) {
              throw new Error(`navigation hairline still active: ${JSON.stringify(pseudo)}`);
            }

            const first = links.first();
            const before = await first.evaluate((item) => getComputedStyle(item).backgroundColor);
            await first.hover();
            await page.waitForTimeout(220);
            const after = await first.evaluate((item) => getComputedStyle(item).backgroundColor);
            if (before === after || after === 'rgba(0, 0, 0, 0)') {
              throw new Error(`navigation hover background did not change: ${before} -> ${after}`);
            }
          }

          async function checkHomepage(viewport, label, mobile) {
            const page = await openPage('/', viewport, label);
            try {
              await noOverflow(page, `${label} homepage`);
              await checkNavigation(page, mobile);
              const hero = page.locator('.sh-hero');
              const h1 = hero.locator('h1');
              if (!(await hero.count()) || !(await h1.isVisible())) throw new Error('homepage hero missing');
              const headline = cleanText(await h1.textContent());
              if (!headline.startsWith('Predajné nástroje na web,')) {
                throw new Error(`unexpected homepage headline: ${headline}`);
              }
              const h1Box = await h1.boundingBox();
              if (!h1Box || h1Box.x < -2 || h1Box.x + h1Box.width > viewport.width + 2) {
                throw new Error('homepage headline escapes viewport');
              }
              const stage = page.locator('.sh-browser__view img[data-active="true"]').first();
              const stageBox = await stage.boundingBox();
              if (!stageBox || stageBox.width < 200 || stageBox.height < 100) throw new Error('hero configurator preview invalid geometry');
              const loaded = await stage.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
              if (!loaded) throw new Error('hero configurator preview image not loaded');
              const cta = page.locator('.sh-hero__actions .sh-btn--lime');
              if (!(await cta.count()) || !(await cta.isVisible())) throw new Error('homepage primary CTA missing');
              await shot(page, `${label}-homepage`, false);
            } finally {
              await page.close();
            }
          }

          async function checkMobileHeadlineSweep() {
            const widths = [280, 320, 360, 375, 390, 414, 430, 480, 600, 720];
            const page = await openPage('/', { width: widths[0], height: 844 }, 'mobile-headline-sweep');
            try {
              for (const width of widths) {
                await page.setViewportSize({ width, height: 844 });
                await page.waitForTimeout(120);
                const state = await page.locator('.sh-hero h1').evaluate((heading) => {
                  const viewportWidth = document.documentElement.clientWidth;
                  const glyphs = [];
                  const walker = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT);
                  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
                    const text = node.textContent || '';
                    for (let index = 0; index < text.length; index += 1) {
                      if (!text[index].trim()) continue;
                      const range = document.createRange();
                      range.setStart(node, index);
                      range.setEnd(node, index + 1);
                      const rect = range.getBoundingClientRect();
                      glyphs.push({ text: text[index], left: rect.left, right: rect.right });
                    }
                  }
                  const rect = heading.getBoundingClientRect();
                  return { viewportWidth, left: rect.left, right: rect.right, glyphs };
                });
                if (!state.glyphs.length) throw new Error(`hero headline glyph nodes missing at ${width}`);
                if (state.left < -1 || state.right > state.viewportWidth + 1) {
                  throw new Error(`mobile headline overflow at ${width}: ${state.left}-${state.right}/${state.viewportWidth}`);
                }
                for (const glyph of state.glyphs) {
                  if (glyph.left < -1 || glyph.right > state.viewportWidth + 1) {
                    throw new Error(`mobile headline overflow at ${width}: hero headline glyph "${glyph.text}" ${glyph.left}-${glyph.right}/${state.viewportWidth}`);
                  }
                }
              }
            } finally {
              await page.close();
            }
          }

          async function checkPricing(viewport, label) {
            const page = await openPage('/cennik/', viewport, label);
            try {
              await noOverflow(page, `${label} pricing`);
              await shot(page, `${label}-cennik`);

              const heading = page.locator('.pricing-hero__copy h1');
              const facts = page.locator('.pricing-hero__fact');
              if (!(await heading.count()) || !(await heading.isVisible())) throw new Error('pricing heading missing');
              if ((await facts.count()) !== 3) throw new Error(`pricing fact count ${await facts.count()}`);
              const headingText = cleanText(await heading.textContent());
              if (!headingText.includes('Jasná cena') || !headingText.includes('Jasný rozsah')) {
                throw new Error(`unexpected pricing heading: ${headingText}`);
              }

              const factTexts = await facts.allTextContents();
              for (const expected of ['347 €', '447 €', '10 €']) {
                if (!factTexts.some((text) => cleanText(text).includes(expected))) {
                  throw new Error(`pricing value ${expected} missing`);
                }
              }

              const factBoxes = [];
              for (let index = 0; index < 3; index += 1) {
                const card = facts.nth(index);
                const box = await card.boundingBox();
                if (!box || box.width < 140 || box.height < 90) throw new Error(`pricing fact ${index + 1} invalid geometry`);
                const size = await card.evaluate((el) => ({ scrollWidth: el.scrollWidth, clientWidth: el.clientWidth }));
                if (size.scrollWidth > size.clientWidth + 3) {
                  throw new Error(`pricing fact ${index + 1} content overflows ${size.scrollWidth}/${size.clientWidth}`);
                }
                factBoxes.push(box);
              }
              for (let a = 0; a < factBoxes.length; a += 1) {
                for (let b = a + 1; b < factBoxes.length; b += 1) {
                  if (overlapArea(factBoxes[a], factBoxes[b]) > 2) throw new Error(`pricing facts ${a + 1}/${b + 1} overlap`);
                }
              }
              if (viewport.width >= 900) {
                const headingBox = await heading.boundingBox();
                const factsBox = await page.locator('.pricing-hero__facts').boundingBox();
                if (overlapArea(headingBox, factsBox) > 2) throw new Error('pricing heading overlaps pricing facts');
              }

              const catalog = page.locator('.pricing-card-grid .pricing-row');
              if ((await catalog.count()) !== 4) throw new Error(`pricing solution card count ${await catalog.count()}`);
              const catalogText = cleanText(await catalog.allTextContents().then((items) => items.join(' ')));
              if (!catalogText.includes('Krokový konfigurátor')) throw new Error('step configurator label missing');
              const custom3d = page.locator('.pricing-row--3d');
              const custom3dText = cleanText(await custom3d.textContent());
              if (!custom3dText.includes('3D konfigurátor') || !custom3dText.includes('podľa rozsahu')) {
                throw new Error(`3D pricing scope missing: ${custom3dText}`);
              }
              if (custom3dText.includes('447 €')) throw new Error('3D configurator incorrectly inherits 447 € price');

              for (let index = 0; index < 4; index += 1) {
                const card = catalog.nth(index);
                await card.scrollIntoViewIfNeeded();
                const box = await card.boundingBox();
                if (!box || box.width < 180 || box.height < 160) throw new Error(`pricing solution ${index + 1} invalid geometry`);
                const size = await card.evaluate((el) => ({ scrollWidth: el.scrollWidth, clientWidth: el.clientWidth }));
                if (size.scrollWidth > size.clientWidth + 3) throw new Error(`pricing solution ${index + 1} overflows`);
              }
            } finally {
              await page.close();
            }
          }

          async function checkProjects(viewport, label) {
            const page = await openPage('/projekty/', viewport, label);
            try {
              await noOverflow(page, `${label} projects`);
              const cards = page.locator('.work-project');
              if ((await cards.count()) !== 4) throw new Error(`realization count ${await cards.count()}`);
              for (let index = 0; index < 4; index += 1) {
                const card = cards.nth(index);
                await card.scrollIntoViewIfNeeded();
                const visual = card.locator('.work-project__visual');
                const meta = card.locator('.work-project__meta');
                const image = visual.locator('img');
                const loaded = await image.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
                if (!loaded) throw new Error(`realization ${index + 1} image not loaded`);
                const visualBox = await visual.boundingBox();
                const metaBox = await meta.boundingBox();
                if (!visualBox || visualBox.width < 180 || visualBox.height < 120) throw new Error(`realization ${index + 1} visual invalid`);
                if (!metaBox || metaBox.width < 120 || metaBox.height < 60) throw new Error(`realization ${index + 1} meta invalid`);
                if (overlapArea(visualBox, metaBox) > 2) throw new Error(`realization ${index + 1} visual overlaps text`);
              }
              await shot(page, `${label}-realizacie`);
            } finally {
              await page.close();
            }
          }

          async function checkServices(viewport, label) {
            const page = await openPage('/sluzby/', viewport, label);
            try {
              await noOverflow(page, `${label} services`);
              const heading = page.locator('.sp-hero h1');
              const visual = page.locator('.subpage-hero-visual');
              if (!(await heading.count()) || !(await heading.isVisible())) throw new Error('services heading missing');
              if ((await visual.count()) !== 1 || !(await visual.isVisible())) throw new Error('services hero image missing');

              const image = visual.locator('img');
              const loaded = await image.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
              if (!loaded) throw new Error('services hero image did not load');

              const summary = page.locator('.services-hero__summary');
              const actions = page.locator('.services-hero__actions');
              if ((await summary.count()) !== 0) throw new Error('rejected services summary returned');
              if ((await actions.count()) !== 0) throw new Error('rejected services hero actions returned');

              const fontSize = Number.parseFloat(await heading.evaluate((el) => getComputedStyle(el).fontSize));
              if (fontSize > 80) throw new Error(`services heading unexpectedly large: ${fontSize}px`);

              const audiences = page.locator('.services-audience');
              if ((await audiences.count()) !== 2) throw new Error(`services audience count ${await audiences.count()}`);
              const audienceText = cleanText(await audiences.allTextContents().then((items) => items.join(' ')));
              if (!audienceText.includes('Firmy so službami') || !audienceText.includes('E-shopy')) {
                throw new Error('services audience labels missing');
              }

              if (viewport.width >= 900) {
                const headingBox = await heading.boundingBox();
                const visualBox = await visual.boundingBox();
                if (!headingBox || !visualBox) throw new Error('services hero geometry missing');
                if (visualBox.width < 300 || visualBox.height < 190) throw new Error('services hero image is too small');
                if (overlapArea(headingBox, visualBox) > 2) throw new Error('services heading overlaps hero image');
              }
              await shot(page, `${label}-sluzby`);
            } finally {
              await page.close();
            }
          }

          async function checkImageHero(path, label) {
            const page = await openPage(path, { width: 1440, height: 1000 }, label);
            try {
              await noOverflow(page, label);
              const heading = page.locator('.sp-hero h1');
              const visual = page.locator('.subpage-hero-visual');
              if (!(await heading.count()) || !(await heading.isVisible())) throw new Error(`${label} heading missing`);
              if ((await visual.count()) !== 1 || !(await visual.isVisible())) throw new Error(`${label} hero visual missing`);
              const image = visual.locator('img');
              const loaded = await image.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
              if (!loaded) throw new Error(`${label} hero image not loaded`);
              const headingBox = await heading.boundingBox();
              const visualBox = await visual.boundingBox();
              if (!headingBox || !visualBox) throw new Error(`${label} invalid hero geometry`);
              if (overlapArea(headingBox, visualBox) > 2) throw new Error(`${label} heading overlaps hero image`);
              const fontSize = Number.parseFloat(await heading.evaluate((el) => getComputedStyle(el).fontSize));
              if (fontSize > 120) throw new Error(`${label} heading unexpectedly large: ${fontSize}px`);
              await shot(page, label);
            } finally {
              await page.close();
            }
          }

          async function checkContact(viewport, label) {
            const page = await openPage('/kontakt/', viewport, label);
            try {
              await noOverflow(page, label);
              const form = page.locator('form');
              if (!(await form.count())) throw new Error('contact form missing');
              if ((await page.locator('form input, form textarea, form select').count()) < 3) throw new Error('contact controls missing');
              const firstInput = form.locator('input').first();
              if (!(await firstInput.isVisible())) throw new Error('contact first input not visible');
              const formWrapBox = await page.locator('.contact-form-wrap').boundingBox();
              if (!formWrapBox || formWrapBox.y >= viewport.height) {
                throw new Error(`contact form starts below first viewport: ${formWrapBox?.y}/${viewport.height}`);
              }
              const lead = page.locator('.contact-page--rebrand > .sp-hero .sp-hero-lead');
              if ((await lead.count()) && (await lead.isVisible())) throw new Error('unnecessary contact lead still visible');
              const submit = page.locator('form button[type="submit"]');
              if (!(await submit.count()) || !(await submit.isVisible())) throw new Error('contact submit missing');
              await shot(page, label);
            } finally {
              await page.close();
            }
          }

          await run('desktop homepage + navigation', () => checkHomepage({ width: 1440, height: 1000 }, 'desktop', false));
          await run('mobile homepage + navigation', () => checkHomepage({ width: 390, height: 844 }, 'mobile', true));
          await run('mobile headline width sweep', checkMobileHeadlineSweep);
          await run('desktop pricing geometry', () => checkPricing({ width: 1440, height: 1000 }, 'desktop'));
          await run('mobile pricing geometry', () => checkPricing({ width: 390, height: 844 }, 'mobile'));
          await run('desktop realizations geometry', () => checkProjects({ width: 1440, height: 1000 }, 'desktop'));
          await run('mobile realizations geometry', () => checkProjects({ width: 390, height: 844 }, 'mobile'));
          await run('desktop services hero + audiences', () => checkServices({ width: 1440, height: 1000 }, 'desktop'));
          await run('mobile services hero + audiences', () => checkServices({ width: 390, height: 844 }, 'mobile'));
          await run('process hero', () => checkImageHero('/postup/', 'desktop-postup'));
          await run('why hero', () => checkImageHero('/preco-chatbot/', 'desktop-preco'));
          await run('desktop contact form above fold', () => checkContact({ width: 1440, height: 1000 }, 'desktop-kontakt'));
          await run('mobile contact form above fold', () => checkContact({ width: 390, height: 844 }, 'mobile-kontakt'));

          fs.writeFileSync(
            'visual-artifacts/report.json',
            JSON.stringify({ checkedAt: new Date().toISOString(), results, failures }, null, 2),
          );
          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(JSON.stringify(results, null, 2));
          JS

          node live-visual-check.mjs

      - name: Upload visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-visual-${{ github.run_id }}
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 14
