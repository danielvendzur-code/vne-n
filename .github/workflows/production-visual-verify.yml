name: Verify live visual layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-current-main
  cancel-in-progress: true

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect current homepage, widget, contact and legal surfaces
        shell: bash
        run: |
          cat > live-visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });

          const overlapArea = (a, b) => {
            if (!a || !b) return 0;
            const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
            const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
            return x * y;
          };

          async function dismissAnalytics(page) {
            const banner = page.locator('.analytics-consent');
            if (await banner.count()) {
              const buttons = await banner.locator('button').evaluateAll((items) =>
                items.map((button) => {
                  const rect = button.getBoundingClientRect();
                  return { width: rect.width, height: rect.height, text: button.textContent?.trim() };
                }),
              );
              if (buttons.length !== 2 || buttons.some((button) => button.height < 40)) {
                throw new Error(`invalid analytics choices: ${JSON.stringify(buttons)}`);
              }
              await banner.getByRole('button', { name: 'Odmietnuť analytiku' }).click();
              await banner.waitFor({ state: 'detached', timeout: 5000 }).catch(() => {});
            }
          }

          async function mountedLauncher(page) {
            for (let attempt = 0; attempt < 25; attempt += 1) {
              for (const frame of page.frames()) {
                const launcher = frame.locator('.cw-launcher');
                if (await launcher.count()) {
                  const data = await launcher.first().evaluate((el) => {
                    const style = getComputedStyle(el);
                    const path = el.querySelector('.bl--launcher .bl__stroke');
                    return {
                      background: style.backgroundColor,
                      borderColor: style.borderColor,
                      backdropFilter: style.backdropFilter || style.webkitBackdropFilter || '',
                      radius: style.borderRadius,
                      width: el.getBoundingClientRect().width,
                      height: el.getBoundingClientRect().height,
                      surfaceTone: el.dataset.surfaceTone || null,
                      stroke: path ? getComputedStyle(path).stroke : null,
                      hostVersion:
                        document.getElementById('dv-assistant-root')?.getAttribute('data-dv-assistant-version') ??
                        null,
                    };
                  });
                  if (data.hostVersion) return { frame, data };
                }
              }
              await page.waitForTimeout(400);
            }
            return null;
          }

          async function readSurfaceTone(page) {
            const mounted = await mountedLauncher(page);
            return mounted?.data.surfaceTone ?? null;
          }

          async function inspectHome(viewport, label) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto(`https://mojchatbot.sk/?visual=${Date.now()}-${label}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await page.evaluate(() => document.fonts?.ready);
            await dismissAnalytics(page);
            await page.waitForTimeout(1200);

            const failures = [];
            const hero = await page.locator('.kage-hero').evaluate((root) => {
              const cases = Array.from(root.querySelectorAll('.hybrid-hero__case')).map((item) => {
                const rect = item.getBoundingClientRect();
                const style = getComputedStyle(item);
                const composite = item.querySelector('.project-composite');
                const image = item.querySelector('.project-composite__site');
                const compositeStyle = composite ? getComputedStyle(composite) : null;
                const imageStyle = image ? getComputedStyle(image) : null;
                const imageRect = image?.getBoundingClientRect();
                return {
                  left: rect.left,
                  top: rect.top,
                  right: rect.right,
                  bottom: rect.bottom,
                  width: rect.width,
                  height: rect.height,
                  opacity: Number(style.opacity),
                  visibility: style.visibility,
                  compositeClipPath: compositeStyle?.clipPath ?? null,
                  compositeOpacity: compositeStyle ? Number(compositeStyle.opacity) : null,
                  imageComplete: image instanceof HTMLImageElement ? image.complete : false,
                  imageNaturalWidth: image instanceof HTMLImageElement ? image.naturalWidth : 0,
                  imageNaturalHeight: image instanceof HTMLImageElement ? image.naturalHeight : 0,
                  imageOpacity: imageStyle ? Number(imageStyle.opacity) : null,
                  imageWidth: imageRect?.width ?? 0,
                  imageHeight: imageRect?.height ?? 0,
                };
              });
              const cta = root.querySelector('.hybrid-hero__primary')?.getBoundingClientRect();
              const headline = root.querySelector('h1')?.getBoundingClientRect();
              const characters = Array.from(root.querySelectorAll('.typed-character'));
              const hiddenCharacters = characters.filter((item) => {
                const style = getComputedStyle(item);
                return Number(style.opacity) < 0.98 || style.visibility === 'hidden';
              }).length;
              const lines = Array.from(root.querySelectorAll('h1 .typed-line')).map((item) => {
                const rect = item.getBoundingClientRect();
                return { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right };
              });
              return {
                cases,
                cta: cta
                  ? { left: cta.left, top: cta.top, right: cta.right, bottom: cta.bottom, width: cta.width, height: cta.height }
                  : null,
                headline: headline
                  ? { left: headline.left, top: headline.top, right: headline.right, bottom: headline.bottom }
                  : null,
                characterCount: characters.length,
                hiddenCharacters,
                lines,
                viewportHeight: innerHeight,
                viewportWidth: innerWidth,
              };
            });

            if (hero.cases.length !== 3) failures.push(`hero project count ${hero.cases.length}`);
            for (const [index, item] of hero.cases.entries()) {
              if (item.width < 100 || item.height < 70) failures.push(`hero project ${index + 1} too small: ${item.width}x${item.height}`);
              if (item.opacity < 0.98 || item.visibility === 'hidden') failures.push(`hero project ${index + 1} is not visible`);
              if (item.left < -2 || item.right > hero.viewportWidth + 2) failures.push(`hero project ${index + 1} outside viewport`);
              if (!item.imageComplete || item.imageNaturalWidth <= 0 || item.imageNaturalHeight <= 0) {
                failures.push(`hero project ${index + 1} image did not load`);
              }
              if (item.compositeOpacity !== null && item.compositeOpacity < 0.98) {
                failures.push(`hero project ${index + 1} composite opacity ${item.compositeOpacity}`);
              }
              if (item.imageOpacity !== null && item.imageOpacity < 0.98) {
                failures.push(`hero project ${index + 1} image opacity ${item.imageOpacity}`);
              }
              if (
                item.compositeClipPath &&
                item.compositeClipPath !== 'none' &&
                !/^inset\(0(px)?( 0(px)?){0,3}\)$/.test(item.compositeClipPath)
              ) {
                failures.push(`hero project ${index + 1} remains clipped: ${item.compositeClipPath}`);
              }
              if (item.imageWidth < item.width - 2 || item.imageHeight < item.height - 2) {
                failures.push(`hero project ${index + 1} image does not fill card: ${item.imageWidth}x${item.imageHeight} vs ${item.width}x${item.height}`);
              }
            }
            const overlap = (a, b) => {
              if (!a || !b) return 0;
              const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
              const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
              return x * y;
            };
            if (hero.cases.length === 3) {
              if (overlap(hero.cases[0], hero.cases[1]) > 2) failures.push('lead hero project overlaps support project 1');
              if (overlap(hero.cases[0], hero.cases[2]) > 2) failures.push('lead hero project overlaps support project 2');
              if (overlap(hero.cases[1], hero.cases[2]) > 2) failures.push('support hero projects overlap');
            }
            if (!hero.characterCount) failures.push('hero headline characters missing');
            if (hero.hiddenCharacters) failures.push(`hero headline has ${hero.hiddenCharacters} hidden characters`);
            if (hero.lines.length !== 3) failures.push(`hero headline line count ${hero.lines.length}`);
            for (let index = 1; index < hero.lines.length; index += 1) {
              const previous = hero.lines[index - 1];
              const current = hero.lines[index];
              if (current.top < previous.bottom - 1) {
                failures.push(`hero headline lines ${index} and ${index + 1} overlap vertically`);
              }
            }
            if (!hero.cta) failures.push('hero CTA missing');
            else {
              if (hero.cta.width < 90 || hero.cta.height < 40) failures.push(`hero CTA too small: ${hero.cta.width}x${hero.cta.height}`);
              if (hero.cta.top < 0 || hero.cta.bottom > hero.viewportHeight + 2) {
                failures.push(`hero CTA outside first viewport: ${hero.cta.top}-${hero.cta.bottom} / ${hero.viewportHeight}`);
              }
            }
            if (hero.headline && hero.cases.length && overlap(hero.headline, hero.cases[0]) > 2) {
              failures.push('hero headline overlaps lead project');
            }

            const heroShot = `live-${label}-hero.png`;
            await page.screenshot({ path: heroShot, fullPage: false });

            const rows = await page.locator('.hybrid-tool').evaluateAll((els) => {
              const overlap = (a, b) => {
                if (!a || !b) return 0;
                const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
                const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
                return x * y;
              };
              return els.map((row) => {
                const title = row.querySelector('strong')?.getBoundingClientRect();
                const benefit = row.querySelector('b')?.getBoundingClientRect();
                const copy = row.querySelector('p')?.getBoundingClientRect();
                const cta = row.querySelector('.hybrid-tool__cta')?.getBoundingClientRect();
                return {
                  name: row.querySelector('strong')?.textContent?.trim() || 'unknown',
                  titleBenefitOverlap: overlap(title, benefit),
                  benefitCopyOverlap: overlap(benefit, copy),
                  copyCtaOverlap: overlap(copy, cta),
                  scrollWidth: row.scrollWidth,
                  clientWidth: row.clientWidth,
                };
              });
            });

            for (const row of rows) {
              if (row.titleBenefitOverlap > 1) failures.push(`${row.name}: title overlaps benefit`);
              if (row.benefitCopyOverlap > 1) failures.push(`${row.name}: benefit overlaps copy`);
              if (row.copyCtaOverlap > 1) failures.push(`${row.name}: copy overlaps CTA`);
              if (row.scrollWidth > row.clientWidth + 2) failures.push(`${row.name}: row overflows`);
            }

            const flow = await page.locator('.kage-flow__step').evaluateAll((steps) =>
              steps.map((step) => {
                const rect = step.getBoundingClientRect();
                return { top: rect.top + scrollY, bottom: rect.bottom + scrollY, width: rect.width, height: rect.height };
              }),
            );
            if (flow.length !== 4) failures.push(`flow step count ${flow.length}`);
            for (let index = 0; index < flow.length; index += 1) {
              if (flow[index].height <= 20 || flow[index].width <= 20) failures.push(`flow step ${index + 1} has invalid size`);
              if (index > 0 && flow[index].top < flow[index - 1].bottom - 2) {
                failures.push(`flow steps ${index} and ${index + 1} overlap`);
              }
            }

            const pageTruth = await page.evaluate(() => {
              const sectionNumbers = Array.from(document.querySelectorAll('.kage-home .section-index b'))
                .map((item) => item.textContent?.trim() ?? '')
                .filter(Boolean);
              const priceTexts = Array.from(document.querySelectorAll('.hybrid-price__grid > div > strong'))
                .map((item) => item.textContent?.trim() ?? '');
              const skip = document.querySelector('.skip-link');
              const skipRect = skip?.getBoundingClientRect();
              return {
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                sectionNumbers,
                priceTexts,
                skip: skip && skipRect
                  ? {
                      focused: document.activeElement === skip,
                      top: skipRect.top,
                      bottom: skipRect.bottom,
                      visibility: getComputedStyle(skip).visibility,
                    }
                  : null,
              };
            });
            const geometry = {
              scrollWidth: pageTruth.scrollWidth,
              clientWidth: pageTruth.clientWidth,
            };
            if (geometry.scrollWidth > geometry.clientWidth + 2) {
              failures.push(`horizontal overflow ${geometry.scrollWidth} > ${geometry.clientWidth}`);
            }
            if (new Set(pageTruth.sectionNumbers).size !== pageTruth.sectionNumbers.length) {
              failures.push(`duplicate homepage section numbers: ${pageTruth.sectionNumbers.join(',')}`);
            }
            if (pageTruth.priceTexts.join('|') !== 'od 347 €|od 447 €|10 €') {
              failures.push(`homepage price DOM is not authoritative before scroll: ${pageTruth.priceTexts.join('|')}`);
            }
            if (
              pageTruth.skip &&
              !pageTruth.skip.focused &&
              pageTruth.skip.visibility !== 'hidden' &&
              pageTruth.skip.bottom > 0 &&
              pageTruth.skip.top < viewport.height
            ) {
              failures.push(`skip link visible without focus: ${JSON.stringify(pageTruth.skip)}`);
            }

            const launcher = await mountedLauncher(page);
            if (!launcher) {
              failures.push('mounted chatbot launcher missing');
            } else {
              const data = launcher.data;
              if (data.width < 40 || data.height < 40) failures.push(`launcher size ${data.width}x${data.height}`);
              if (data.radius !== '50%') failures.push(`launcher radius ${data.radius}`);
              if (!data.stroke || !data.stroke.includes('url(')) failures.push(`adaptive launcher stroke missing: ${data.stroke}`);

              const widgetFrame = launcher.frame;
              const launcherButton = widgetFrame.locator('.cw-launcher').first();
              await launcherButton.click();
              const panel = widgetFrame.locator('.cw-panel');
              await panel.waitFor({ state: 'visible', timeout: 5000 });

              const headerStroke = widgetFrame.locator('.cw-panel-head .bl__stroke').first();
              const headerStart = await headerStroke.evaluate((el) => ({
                dash: getComputedStyle(el).strokeDashoffset,
                opacity: getComputedStyle(el).opacity,
              }));
              await page.waitForTimeout(450);
              const headerEnd = await headerStroke.evaluate((el) => ({
                dash: getComputedStyle(el).strokeDashoffset,
                opacity: getComputedStyle(el).opacity,
              }));
              if (headerStart.dash !== headerEnd.dash || headerStart.opacity !== headerEnd.opacity) {
                failures.push(`open chatbot logo moves: ${JSON.stringify({ headerStart, headerEnd })}`);
              }

              await widgetFrame.locator('[data-testid="tab-calculator"]').click();
              const firstChoice = widgetFrame.locator('[data-testid="interest-chatbot"]');
              await firstChoice.waitFor({ state: 'visible', timeout: 5000 });
              await firstChoice.click();
              await page.waitForTimeout(70);

              const selectedState = await firstChoice.evaluate((el) => {
                const indicator = el.querySelector('.cw-selection-indicator');
                const pseudo = getComputedStyle(el, '::after');
                const rect = indicator?.getBoundingClientRect();
                const card = el.getBoundingClientRect();
                return {
                  selected: el.getAttribute('data-selected'),
                  pseudoContent: pseudo.content,
                  indicatorCount: el.querySelectorAll('.cw-selection-indicator').length,
                  indicatorVisible: indicator?.getAttribute('data-visible') ?? null,
                  indicatorCenterY: rect ? rect.top + rect.height / 2 : null,
                  cardCenterY: card.top + card.height / 2,
                };
              });
              if (selectedState.selected !== 'true') failures.push('configurator choice did not become selected');
              if (selectedState.indicatorCount !== 1) failures.push(`selected choice has ${selectedState.indicatorCount} indicators`);
              if (selectedState.indicatorVisible !== 'true') failures.push('selected choice indicator is not visible');
              if (!['none', 'normal'].includes(selectedState.pseudoContent)) {
                failures.push(`selected choice still renders pseudo check ${selectedState.pseudoContent}`);
              }
              if (
                selectedState.indicatorCenterY !== null &&
                Math.abs(selectedState.indicatorCenterY - selectedState.cardCenterY) > 1.5
              ) {
                failures.push('selected check is not vertically centered');
              }

              await widgetFrame.locator('[data-testid="widget-close"]').click();
              await page.waitForTimeout(300);
            }

            await page.locator('#riesenia').scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);
            const lightTone = await readSurfaceTone(page);
            await page.locator('#ako-to-funguje').scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);
            const darkTone = await readSurfaceTone(page);
            if (lightTone !== 'light') failures.push(`launcher light-section tone is ${lightTone}`);
            if (darkTone !== 'dark') failures.push(`launcher dark-section tone is ${darkTone}`);

            const shot = `live-${label}.png`;
            await page.screenshot({ path: shot, fullPage: true });
            await page.close();
            return { label, viewport, hero, heroShot, rows, flow, geometry, pageTruth, lightTone, darkTone, launcher: launcher?.data ?? null, failures, shot };
          }

          async function inspectContact() {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await page.goto(`https://mojchatbot.sk/kontakt?visual=${Date.now()}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await dismissAnalytics(page);

            const failures = [];
            if ((await page.locator('.contact-privacy-note').count()) !== 1) failures.push('contact privacy notice missing');
            if (await page.locator('.contact-form input[type="checkbox"]').count()) failures.push('obsolete contact consent checkbox remains');

            const form = await page.locator('.contact-form-wrap').evaluate((el) => {
              const rect = el.getBoundingClientRect();
              return {
                left: rect.left,
                right: rect.right,
                width: rect.width,
                scrollWidth: el.scrollWidth,
                clientWidth: el.clientWidth,
              };
            });
            if (form.left < -1 || form.right > 391) failures.push(`contact form outside viewport: ${JSON.stringify(form)}`);
            if (form.scrollWidth > form.clientWidth + 2) failures.push('contact form overflows horizontally');

            const text = await page.locator('body').innerText();
            if (!text.includes('Venaco s.r.o.')) failures.push('contact page operator missing');

            const shot = 'live-contact-mobile.png';
            await page.screenshot({ path: shot, fullPage: true });
            await page.close();
            return { failures, form, shot };
          }

          async function inspectLegal() {
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            await page.goto(`https://mojchatbot.sk/pravne-informacie?visual=${Date.now()}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            const text = await page.locator('body').innerText();
            const required = ['Venaco s.r.o.', '45648107', '2023076407', 'SK2023076407', '27111/N', 'Orgán dozoru'];
            const failures = required.filter((item) => !text.includes(item)).map((item) => `legal page missing ${item}`);
            await page.close();
            return { failures };
          }

          const desktop = await inspectHome({ width: 1583, height: 900 }, 'desktop-1583');
          const mobile = await inspectHome({ width: 390, height: 844 }, 'mobile-390');
          const contact = await inspectContact();
          const legal = await inspectLegal();
          const failures = [...desktop.failures, ...mobile.failures, ...contact.failures, ...legal.failures];

          fs.writeFileSync(
            'live-visual-results.json',
            JSON.stringify({ desktop, mobile, contact, legal, failures }, null, 2),
          );
          console.log(JSON.stringify({ desktop, mobile, contact, legal, failures }, null, 2));

          await browser.close();
          if (failures.length) {
            console.error('\nVISUAL_FAILURES');
            failures.forEach((failure) => console.error(`- ${failure}`));
            process.exit(1);
          }
          console.log('\nLIVE_COMPUTED_VISUAL=success');
          JS
          node live-visual-check.mjs

      - name: Upload screenshots and computed metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-computed-visual-${{ github.run_id }}
          path: |
            live-desktop-1583.png
            live-desktop-1583-hero.png
            live-mobile-390.png
            live-mobile-390-hero.png
            live-contact-mobile.png
            live-visual-results.json
          retention-days: 7
