name: Verify live visual layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-current-main
  cancel-in-progress: true

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait until this exact SHA is live
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            body="$(curl --location --fail --silent --show-error --header 'Cache-Control: no-cache' \
              "https://mojchatbot.sk/build-meta.json?visual=${SOURCE_SHA}-${attempt}" || true)"
            if printf '%s' "$body" | grep -Fq "$SOURCE_SHA"; then
              echo "Verified live SHA: $SOURCE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for $SOURCE_SHA on mojchatbot.sk"
          exit 1

      - name: Inspect restored baseline and scoped subpage changes
        shell: bash
        run: |
          cat > live-visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('visual-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const results = [];

          const overlapArea = (a, b) => {
            if (!a || !b) return 0;
            const x = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
            const y = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
            return x * y;
          };

          const cleanText = (value) => (value || '').replace(/\s+/g, ' ').trim();

          async function dismissAnalytics(page) {
            const banner = page.locator('.analytics-consent');
            if (!(await banner.count())) return;
            const reject = banner.getByRole('button', { name: /Odmietnuť analytiku/i });
            if (await reject.count()) {
              await reject.click();
              await banner.waitFor({ state: 'detached', timeout: 4000 }).catch(() => {});
            }
          }

          async function openPage(path, viewport, label) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`https://mojchatbot.sk${path}?visual=${Date.now()}-${label}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await page.evaluate(() => document.fonts?.ready);
            await dismissAnalytics(page);
            await page.waitForTimeout(700);
            return page;
          }

          async function assertNoHorizontalOverflow(page, label) {
            const sizes = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            if (sizes.scrollWidth > sizes.clientWidth + 3) {
              throw new Error(`${label} horizontal overflow ${sizes.scrollWidth}/${sizes.clientWidth}`);
            }
          }

          async function screenshot(page, name, fullPage = true) {
            await page.screenshot({ path: `visual-artifacts/${name}.png`, fullPage });
          }

          async function run(name, fn) {
            try {
              await fn();
              results.push({ name, status: 'passed' });
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              failures.push(`${name}: ${message}`);
              results.push({ name, status: 'failed', message });
            }
          }

          async function checkNavigation(page, mobile = false) {
            const header = page.locator('.site-header');
            if (!(await header.count()) || !(await header.isVisible())) throw new Error('site header missing');

            if (!mobile) {
              const links = page.locator('.site-nav a');
              if ((await links.count()) < 4) throw new Error('desktop navigation links missing');
              const styles = await links.evaluateAll((items) =>
                items.map((item) => ({
                  afterDisplay: getComputedStyle(item, '::after').display,
                  fontFamily: getComputedStyle(item).fontFamily,
                  fontSize: getComputedStyle(item).fontSize,
                })),
              );
              if (styles.some((item) => item.afterDisplay !== 'none')) {
                throw new Error(`navigation hairline still active: ${JSON.stringify(styles)}`);
              }
            } else {
              const toggle = page.locator('.site-menu-toggle');
              if (!(await toggle.count()) || !(await toggle.isVisible())) throw new Error('mobile menu toggle missing');
              await toggle.click();
              const layer = page.locator('.site-menu-layer[data-open="true"]');
              await layer.waitFor({ state: 'visible', timeout: 3000 });
              if ((await layer.locator('.site-menu-nav a').count()) < 4) throw new Error('mobile menu links missing');
              const close = layer.locator('.site-menu-close');
              if (await close.count()) await close.click();
            }
          }

          async function checkHomepage(viewport, label, mobile = false) {
            const page = await openPage('/', viewport, label);
            try {
              await assertNoHorizontalOverflow(page, `${label} homepage`);
              await checkNavigation(page, mobile);

              const hero = page.locator('.kage-hero');
              if (!(await hero.count())) throw new Error('homepage hero missing');
              const h1 = hero.locator('h1');
              const headline = cleanText(await h1.textContent());
              if (!headline.includes('Z otázky') || !headline.includes('k výsledku')) {
                throw new Error(`unexpected restored headline: ${headline}`);
              }

              const heroBox = await h1.boundingBox();
              if (!heroBox || heroBox.width < 200 || heroBox.height < 60) throw new Error('homepage headline has invalid geometry');
              if (heroBox.x < -2 || heroBox.x + heroBox.width > viewport.width + 2) throw new Error('homepage headline escapes viewport');

              const cases = page.locator('.hybrid-hero__case');
              if ((await cases.count()) !== 3) throw new Error(`hero realization count ${await cases.count()}`);
              for (let index = 0; index < 3; index += 1) {
                const item = cases.nth(index);
                const box = await item.boundingBox();
                if (!box || box.width < 90 || box.height < 65) throw new Error(`hero realization ${index + 1} invalid geometry`);
                const image = item.locator('img').first();
                const loaded = await image.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
                if (!loaded) throw new Error(`hero realization ${index + 1} image not loaded`);
              }

              const cta = page.locator('.hybrid-hero__primary');
              if (!(await cta.count()) || !(await cta.isVisible())) throw new Error('homepage primary CTA missing');
              await screenshot(page, `${label}-homepage`, false);
            } finally {
              await page.close();
            }
          }

          async function checkPricing(viewport, label) {
            const page = await openPage('/cennik/', viewport, label);
            try {
              await assertNoHorizontalOverflow(page, `${label} pricing`);
              const heading = page.locator('.pricing-hero__copy h1');
              const facts = page.locator('.pricing-hero__fact');
              if (!(await heading.count())) throw new Error('pricing heading missing');
              if ((await facts.count()) !== 3) throw new Error(`pricing fact count ${await facts.count()}`);

              const headingText = cleanText(await heading.textContent());
              if (!headingText.includes('Jasná cena') || !headingText.includes('Jasný rozsah')) {
                throw new Error(`unexpected pricing heading: ${headingText}`);
              }

              const factTexts = await facts.allTextContents();
              for (const expected of ['347 €', '447 €', '10 €']) {
                if (!factTexts.some((text) => cleanText(text).includes(expected))) {
                  throw new Error(`pricing value ${expected} missing: ${JSON.stringify(factTexts)}`);
                }
              }

              const boxes = [];
              for (let index = 0; index < 3; index += 1) {
                const card = facts.nth(index);
                const box = await card.boundingBox();
                if (!box || box.width < 140 || box.height < 90) throw new Error(`pricing card ${index + 1} invalid geometry`);
                const overflow = await card.evaluate((el) => ({ scrollWidth: el.scrollWidth, clientWidth: el.clientWidth }));
                if (overflow.scrollWidth > overflow.clientWidth + 3) {
                  throw new Error(`pricing card ${index + 1} content overflows ${overflow.scrollWidth}/${overflow.clientWidth}`);
                }
                boxes.push(box);
              }
              for (let a = 0; a < boxes.length; a += 1) {
                for (let b = a + 1; b < boxes.length; b += 1) {
                  if (overlapArea(boxes[a], boxes[b]) > 2) throw new Error(`pricing cards ${a + 1}/${b + 1} overlap`);
                }
              }

              if (viewport.width >= 900) {
                const headingBox = await heading.boundingBox();
                const factsBox = await page.locator('.pricing-hero__facts').boundingBox();
                if (overlapArea(headingBox, factsBox) > 2) throw new Error('pricing heading overlaps pricing facts');
              }

              await screenshot(page, `${label}-cennik`);
            } finally {
              await page.close();
            }
          }

          async function checkProjects(viewport, label) {
            const page = await openPage('/projekty/', viewport, label);
            try {
              await assertNoHorizontalOverflow(page, `${label} projects`);
              const cards = page.locator('.work-project');
              if ((await cards.count()) !== 4) throw new Error(`realization count ${await cards.count()}`);

              for (let index = 0; index < 4; index += 1) {
                const card = cards.nth(index);
                await card.scrollIntoViewIfNeeded();
                await page.waitForTimeout(150);
                const visual = card.locator('.work-project__visual');
                const meta = card.locator('.work-project__meta');
                const image = visual.locator('img');
                const loaded = await image.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
                if (!loaded) throw new Error(`realization ${index + 1} image not loaded`);
                const visualBox = await visual.boundingBox();
                const metaBox = await meta.boundingBox();
                if (!visualBox || visualBox.width < 180 || visualBox.height < 120) throw new Error(`realization ${index + 1} visual invalid`);
                if (!metaBox || metaBox.width < 120 || metaBox.height < 60) throw new Error(`realization ${index + 1} meta invalid`);
                if (overlapArea(visualBox, metaBox) > 2) throw new Error(`realization ${index + 1} visual overlaps text`);
              }

              await screenshot(page, `${label}-realizacie`);
            } finally {
              await page.close();
            }
          }

          async function checkInfoPage(path, label, viewport, screenshotName) {
            const page = await openPage(path, viewport, screenshotName);
            try {
              await assertNoHorizontalOverflow(page, `${screenshotName} info page`);
              const heading = page.locator('.sp-hero h1');
              const visual = page.locator('.subpage-hero-visual');
              const image = visual.locator('img');
              if (!(await heading.count()) || !(await heading.isVisible())) throw new Error(`${label} heading missing`);
              if ((await visual.count()) !== 1 || !(await visual.isVisible())) throw new Error(`${label} hero visual missing`);
              const loaded = await image.evaluate((img) => img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0);
              if (!loaded) throw new Error(`${label} hero image not loaded`);

              const fontSize = Number.parseFloat(await heading.evaluate((el) => getComputedStyle(el).fontSize));
              const maxFont = viewport.width >= 900 ? 80 : 66;
              if (fontSize > maxFont) throw new Error(`${label} heading too large: ${fontSize}px`);

              const headingBox = await heading.boundingBox();
              const visualBox = await visual.boundingBox();
              if (!headingBox || !visualBox) throw new Error(`${label} invalid hero geometry`);
              if (overlapArea(headingBox, visualBox) > 2) throw new Error(`${label} heading overlaps hero image`);
              await screenshot(page, screenshotName);
            } finally {
              await page.close();
            }
          }

          async function checkContact() {
            const page = await openPage('/kontakt/', { width: 1440, height: 1000 }, 'desktop-contact');
            try {
              await assertNoHorizontalOverflow(page, 'contact');
              if (!(await page.locator('form').count())) throw new Error('contact form missing');
              const controls = page.locator('form input, form textarea, form select');
              if ((await controls.count()) < 3) throw new Error(`contact form control count ${await controls.count()}`);
              const submit = page.locator('form button[type="submit"]');
              if (!(await submit.count()) || !(await submit.isVisible())) throw new Error('contact submit missing');
              await screenshot(page, 'desktop-kontakt');
            } finally {
              await page.close();
            }
          }

          await run('desktop homepage + navigation', () => checkHomepage({ width: 1440, height: 1000 }, 'desktop', false));
          await run('mobile homepage + navigation', () => checkHomepage({ width: 390, height: 844 }, 'mobile', true));
          await run('desktop pricing geometry', () => checkPricing({ width: 1440, height: 1000 }, 'desktop'));
          await run('mobile pricing geometry', () => checkPricing({ width: 390, height: 844 }, 'mobile'));
          await run('desktop realizations geometry', () => checkProjects({ width: 1440, height: 1000 }, 'desktop'));
          await run('mobile realizations geometry', () => checkProjects({ width: 390, height: 844 }, 'mobile'));
          await run('services hero', () => checkInfoPage('/sluzby/', 'services', { width: 1440, height: 1000 }, 'desktop-sluzby'));
          await run('process hero', () => checkInfoPage('/postup/', 'process', { width: 1440, height: 1000 }, 'desktop-postup'));
          await run('why hero', () => checkInfoPage('/preco-chatbot/', 'why', { width: 1440, height: 1000 }, 'desktop-preco'));
          await run('mobile services hero', () => checkInfoPage('/sluzby/', 'services mobile', { width: 390, height: 844 }, 'mobile-sluzby'));
          await run('contact form', checkContact);

          fs.writeFileSync(
            'visual-artifacts/report.json',
            JSON.stringify({ checkedAt: new Date().toISOString(), results, failures }, null, 2),
          );

          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(JSON.stringify(results, null, 2));
          JS

          node live-visual-check.mjs

      - name: Upload visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-visual-${{ github.run_id }}
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 14
