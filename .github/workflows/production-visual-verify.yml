name: Verify live visual layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-current-main
  cancel-in-progress: true

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait until this exact SHA is live
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            body="$(curl --location --fail --silent --show-error --header 'Cache-Control: no-cache' \
              "https://mojchatbot.sk/build-meta.json?visual=${SOURCE_SHA}-${attempt}" || true)"
            if printf '%s' "$body" | grep -Fq "$SOURCE_SHA"; then
              echo "Verified live SHA: $SOURCE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for $SOURCE_SHA on mojchatbot.sk"
          exit 1

      - name: Inspect current visual and functional rules
        shell: bash
        run: |
          LIVE_SITE_ORIGIN=https://mojchatbot.sk node scripts/verify-cinematic-ui.mjs

      - name: Upload visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-visual-${{ github.run_id }}
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 14
