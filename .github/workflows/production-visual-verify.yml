name: Verify live visual layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-current-main
  cancel-in-progress: true

jobs:
  visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect actual mojchatbot.sk computed layout
        shell: bash
        run: |
          cat > live-visual-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const alphaOf = (value) => {
            const channels = String(value || '').match(/[\d.]+/g)?.map(Number) ?? [];
            if (channels.length >= 4) return channels[3];
            if (channels.length >= 3) return 1;
            return 0;
          };

          async function inspect(viewport, label, attempt) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto(`https://mojchatbot.sk/?visual=${Date.now()}-${label}-${attempt}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            await page.evaluate(() => document.fonts?.ready);
            await page.waitForTimeout(1200);

            const rows = await page.locator('.hybrid-tool').evaluateAll((els) => els.map((row) => {
              const title = row.querySelector('strong');
              const benefit = row.querySelector('b');
              const copy = row.querySelector('p');
              const cta = row.querySelector('.hybrid-tool__cta');
              const overlap = (a, b) => {
                if (!a || !b) return 0;
                const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
                const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
                return x * y;
              };
              const tr = title?.getBoundingClientRect();
              const br = benefit?.getBoundingClientRect();
              const pr = copy?.getBoundingClientRect();
              const cr = cta?.getBoundingClientRect();
              return {
                title: title?.textContent?.trim(),
                cta: cta?.textContent?.trim(),
                titleBenefitOverlap: overlap(tr, br),
                benefitCopyOverlap: overlap(br, pr),
                copyCtaOverlap: overlap(pr, cr),
                rowScrollWidth: row.scrollWidth,
                rowClientWidth: row.clientWidth,
              };
            }));

            const flow = await page.locator('.plain-flow-story__viewport').first().evaluate((el) => {
              const style = getComputedStyle(el);
              const panels = Array.from(el.querySelectorAll('[data-flow-stage]'));
              return {
                overflowX: style.overflowX,
                clientWidth: el.clientWidth,
                scrollWidth: el.scrollWidth,
                panelCount: panels.length,
                panelWidths: panels.map((panel) => panel.getBoundingClientRect().width),
              };
            }).catch(() => null);

            const hero = await page.locator('.kage-hero h1').first().evaluate((el) => {
              const style = getComputedStyle(el);
              const characters = Array.from(el.querySelectorAll('.typed-character'));
              return {
                lineHeight: Number.parseFloat(style.lineHeight),
                fontSize: Number.parseFloat(style.fontSize),
                characterTransforms: characters.map((character) => getComputedStyle(character).transform),
              };
            }).catch(() => null);

            const projectCta = await page.locator('.site-header__cta').first().evaluate(async (el) => {
              const rest = getComputedStyle(el);
              const restBackground = rest.backgroundColor;
              return { restBackground };
            }).catch(() => null);

            const calculatorCta = rows.find((row) => row.title === 'Kalkulačka')?.cta ?? null;

            let launcher = null;
            for (const frame of page.frames()) {
              const candidate = frame.locator('.cw-launcher');
              if (await candidate.count()) {
                launcher = await candidate.first().evaluate((el) => {
                  const s = getComputedStyle(el);
                  return {
                    background: s.backgroundColor,
                    backgroundImage: s.backgroundImage,
                    boxShadow: s.boxShadow,
                    borderColor: s.borderColor,
                    borderRadius: s.borderRadius,
                    backdropFilter: s.backdropFilter || s.webkitBackdropFilter || '',
                    rect: el.getBoundingClientRect().toJSON(),
                    hostVersion: document.getElementById('dv-assistant-root')?.getAttribute('data-dv-assistant-version') ?? null,
                  };
                });
                break;
              }
            }

            const geometry = await page.evaluate(() => ({
              innerWidth,
              innerHeight,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));

            const shot = `live-${label}.png`;
            await page.screenshot({ path: shot, fullPage: true });
            const result = {
              label,
              viewport,
              url: page.url(),
              rows,
              flow,
              hero,
              projectCta,
              calculatorCta,
              launcher,
              geometry,
              shot,
            };
            await page.close();
            return result;
          }

          let finalResults = null;
          let finalFailures = [];

          for (let attempt = 1; attempt <= 18; attempt += 1) {
            const desktop = await inspect({ width: 1583, height: 900 }, 'desktop-1583', attempt);
            const mobile = await inspect({ width: 390, height: 844 }, 'mobile-390', attempt);
            const failures = [];

            for (const row of desktop.rows) {
              if (row.titleBenefitOverlap > 1) failures.push(`${row.title}: title overlaps benefit`);
              if (row.benefitCopyOverlap > 1) failures.push(`${row.title}: benefit overlaps copy`);
              if (row.copyCtaOverlap > 1) failures.push(`${row.title}: copy overlaps CTA`);
              if (row.rowScrollWidth > row.rowClientWidth + 2) failures.push(`${row.title}: desktop row overflows`);
            }

            if (desktop.geometry.innerWidth !== 1583 || desktop.geometry.innerHeight !== 900) {
              failures.push(`desktop viewport is ${desktop.geometry.innerWidth}x${desktop.geometry.innerHeight}`);
            }
            if (mobile.geometry.innerWidth !== 390 || mobile.geometry.innerHeight !== 844) {
              failures.push(`mobile viewport is ${mobile.geometry.innerWidth}x${mobile.geometry.innerHeight}`);
            }

            const checkHorizontalFlow = (flow, label) => {
              if (!flow) {
                failures.push(`${label} horizontal flow missing`);
                return;
              }
              if (!['auto', 'scroll'].includes(flow.overflowX)) {
                failures.push(`${label} flow overflow-x ${flow.overflowX}`);
              }
              if (flow.panelCount !== 4) failures.push(`${label} flow panel count ${flow.panelCount}`);
              if (flow.scrollWidth <= flow.clientWidth * 2.5) {
                failures.push(`${label} flow is not horizontally scrollable: ${flow.scrollWidth}/${flow.clientWidth}`);
              }
              if (flow.panelWidths.some((width) => width <= 0)) failures.push(`${label} flow contains zero-width panel`);
            };

            checkHorizontalFlow(desktop.flow, 'desktop');
            checkHorizontalFlow(mobile.flow, 'mobile');

            if (!desktop.hero || !Number.isFinite(desktop.hero.lineHeight) || !Number.isFinite(desktop.hero.fontSize)) {
              failures.push('desktop hero typography unavailable');
            } else if (desktop.hero.lineHeight / desktop.hero.fontSize < 0.9) {
              failures.push(`desktop hero line-height ratio ${(desktop.hero.lineHeight / desktop.hero.fontSize).toFixed(2)}`);
            }
            if (desktop.hero?.characterTransforms.some((transform) => transform !== 'none')) {
              failures.push('desktop hero characters retain transforms after typing');
            }

            if (desktop.projectCta?.restBackground !== 'rgb(200, 240, 106)') {
              failures.push(`desktop project CTA background ${desktop.projectCta?.restBackground ?? 'missing'}`);
            }
            if (desktop.calculatorCta !== 'Vyskladať kalkulačku') {
              failures.push(`calculator CTA is ${desktop.calculatorCta ?? 'missing'}`);
            }

            const checkLauncher = (launcher, label) => {
              if (!launcher) {
                failures.push(`${label} launcher missing`);
                return;
              }
              const backgroundAlpha = alphaOf(launcher.background);
              const borderAlpha = alphaOf(launcher.borderColor);
              if (!(backgroundAlpha >= 0.03 && backgroundAlpha <= 0.14)) {
                failures.push(`${label} launcher background alpha ${backgroundAlpha} (${launcher.background})`);
              }
              if (!(borderAlpha >= 0.15 && borderAlpha <= 0.55)) {
                failures.push(`${label} launcher border alpha ${borderAlpha} (${launcher.borderColor})`);
              }
              if (launcher.backgroundImage !== 'none') failures.push(`${label} launcher background-image ${launcher.backgroundImage}`);
              if (launcher.borderRadius !== '50%') failures.push(`${label} launcher radius ${launcher.borderRadius}`);
              if (!launcher.backdropFilter.includes('blur(')) failures.push(`${label} launcher backdrop-filter ${launcher.backdropFilter}`);
              if (launcher.hostVersion !== 'premium-motion-20260829-v14') failures.push(`${label} widget version ${launcher.hostVersion}`);
            };

            checkLauncher(desktop.launcher, 'desktop');
            checkLauncher(mobile.launcher, 'mobile');

            if (mobile.geometry.scrollWidth > mobile.geometry.clientWidth + 2) {
              failures.push(`mobile horizontal overflow ${mobile.geometry.scrollWidth} > ${mobile.geometry.clientWidth}`);
            }

            finalResults = [desktop, mobile];
            finalFailures = failures;
            fs.writeFileSync('live-visual-results.json', JSON.stringify({ attempt, results: finalResults, failures }, null, 2));
            console.log(JSON.stringify({ attempt, results: finalResults, failures }, null, 2));

            if (!failures.length) {
              console.log('\nLIVE_COMPUTED_VISUAL=success');
              await browser.close();
              process.exit(0);
            }

            console.error(`Attempt ${attempt}/18 failed: ${failures.join('; ')}`);
            if (attempt < 18) await new Promise((resolve) => setTimeout(resolve, 10000));
          }

          await browser.close();
          console.error('\nVISUAL_FAILURES');
          finalFailures.forEach((failure) => console.error(`- ${failure}`));
          process.exit(1);
          JS
          node live-visual-check.mjs

      - name: Upload screenshots and computed metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-computed-visual-${{ github.run_id }}
          path: |
            live-desktop-1583.png
            live-mobile-390.png
            live-visual-results.json
          retention-days: 7
