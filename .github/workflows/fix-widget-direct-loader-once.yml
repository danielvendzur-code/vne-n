name: Fix direct widget loader once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-widget-direct-loader-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace the stale iframe loader with the direct widget build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('src/routes/__root.tsx')
          root_text = root.read_text(encoding='utf-8')
          root_text = root_text.replace(
              '"https://danielvendzur-code.github.io/moj.chatbot.backend/embed.js";',
              '"https://danielvendzur-code.github.io/moj.chatbot.backend/widget.js";',
          )
          root_text = root_text.replace(
              '    const url = new URL(candidate);\n    const local =',
              '    const url = new URL(candidate);\n'
              '    // Staršia Vercel premenná mohla ešte ukazovať na iframe build.\n'
              '    // Normalizujeme ju na aktuálny priamy widget bez potreby meniť env.\n'
              '    if (url.pathname.endsWith("/embed.js")) {\n'
              '      url.pathname = `${url.pathname.slice(0, -"embed.js".length)}widget.js`;\n'
              '    }\n'
              '    const local =',
          )
          root_text = root_text.replace(
              '// Živá ukážka chatbota je jednoriadkový iframe na jeho vlastný repozitár,\n'
              '// takže sa dá meniť tam bez zásahu do kódu webu.',
              '// Widget sa načítava ako priamy, izolovaný skript z vlastného repozitára,\n'
              '// takže sa dá meniť bez zásahu do aplikačného bundlu webu.',
          )
          root.write_text(root_text, encoding='utf-8')

          loader = Path('public/widget-loader.js')
          loader_text = loader.read_text(encoding='utf-8')
          old_source = '''  const SOURCE =
    document.documentElement.dataset.assistantSource ||
    "https://danielvendzur-code.github.io/moj.chatbot.backend/embed.js";
  const HOST_ID = "site-assistant-widget-host";'''
          new_source = '''  const normalizeSource = (value) =>
    String(value || "")
      .trim()
      .replace(/\\/embed\\.js(?=([?#]|$))/, "/widget.js");

  const SOURCE = normalizeSource(
    document.documentElement.dataset.assistantSource ||
      "https://danielvendzur-code.github.io/moj.chatbot.backend/widget.js",
  );
  const HOST_ID = "dv-assistant-root";'''
          if old_source not in loader_text:
              raise SystemExit('Expected loader source block not found')
          loader_text = loader_text.replace(old_source, new_source)

          old_mounted = '''  const hasMountedWidget = () =>
    Boolean(
      document.getElementById(HOST_ID) &&
      typeof window.openSiteAssistant === "function" &&
      window.openSiteAssistant.__siteAssistantEmbed,
    );'''
          new_mounted = '''  const hasMountedWidget = () => {
    const host = document.getElementById(HOST_ID);
    return Boolean(
      host &&
        host.childElementCount > 0 &&
        typeof window.openSiteAssistant === "function",
    );
  };'''
          if old_mounted not in loader_text:
              raise SystemExit('Expected mounted-widget block not found')
          loader.write_text(loader_text.replace(old_mounted, new_mounted), encoding='utf-8')

          tests = Path('tests/home-contract.test.mjs')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'test("assistant loader targets the direct widget build and its real host"'
          if marker not in test_text:
              test_text += '''\n\ntest("assistant loader targets the direct widget build and its real host", async () => {
  const root = await read("src/routes/__root.tsx");
  const loader = await read("public/widget-loader.js");

  assert.match(root, /moj\\.chatbot\\.backend\\/widget\\.js/);
  assert.match(root, /pathname\\.endsWith\\("\\/embed\\.js"\\)/);
  assert.match(loader, /moj\\.chatbot\\.backend\\/widget\\.js/);
  assert.match(loader, /replace\\(\\/\\\\\\/embed\\\\\\.js/);
  assert.match(loader, /HOST_ID = "dv-assistant-root"/);
  assert.match(loader, /host\\.childElementCount > 0/);
  assert.doesNotMatch(loader, /HOST_ID = "site-assistant-widget-host"/);
  assert.doesNotMatch(loader, /__siteAssistantEmbed/);
});\n'''
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Format changed files
        run: npx prettier --write src/routes/__root.tsx public/widget-loader.js tests/home-contract.test.mjs

      - name: Contract tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build:vercel

      - name: Remove helper and commit validated fix
        shell: bash
        run: |
          rm .github/workflows/fix-widget-direct-loader-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/__root.tsx public/widget-loader.js tests/home-contract.test.mjs .github/workflows/fix-widget-direct-loader-once.yml
          git commit -m 'fix: load the direct widget build instead of the blocked iframe'
          git push origin HEAD:${{ github.head_ref }}
