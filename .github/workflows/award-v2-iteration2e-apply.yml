name: Apply award v2 iteration 2e

on:
  push:
    branches:
      - award/rebuild-v2-2026-08-23

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: award/rebuild-v2-2026-08-23
      - name: Remove brand from scroll guide and animate hero chatbot mark
        run: |
          node <<'NODE'
          const fs = require('fs');
          const landingPath = 'src/components/site/AwardV2Landing.tsx';
          let landing = fs.readFileSync(landingPath, 'utf8');
          const oldTraveler = `      <div className="award2-guide__traveler">\n        <span className="award2-guide__glare" />\n        <BrandMark size={30} />\n        <small>\n          <b>{chapters[active].index}</b>\n          {chapters[active].label}\n        </small>\n      </div>`;
          const newTraveler = `      <div className="award2-guide__traveler">\n        <span className="award2-guide__glare" />\n        <span className="award2-guide__lens-core" />\n        <small>\n          <b>{chapters[active].index}</b>\n          {chapters[active].label}\n        </small>\n      </div>`;
          if (!landing.includes(oldTraveler)) throw new Error('scroll traveler target missing');
          landing = landing.replace(oldTraveler, newTraveler);
          fs.writeFileSync(landingPath, landing);

          const cssPath = 'src/components/site/AwardV2Iteration2.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const marker = '/* Scroll lens without brand + chatbot mark chroma — iteration 2e */';
          if (!css.includes(marker)) {
            css += `\n\n${marker}\n.award2-guide__traveler {\n  width: 46px;\n  height: 46px;\n  border-radius: 50%;\n  border-color: rgba(200, 240, 106, 0.46);\n  background: rgba(244, 241, 224, 0.12);\n  box-shadow: 0 14px 38px -22px rgba(0, 0, 0, 0.72), inset 0 1px rgba(255, 255, 255, 0.28);\n}\n\n.award2-guide__lens-core {\n  position: absolute;\n  inset: 10px;\n  z-index: 2;\n  border-radius: 50%;\n  border: 1px solid rgba(255, 255, 255, 0.28);\n  background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.36), rgba(200, 240, 106, 0.11) 38%, rgba(18, 56, 45, 0.08) 72%);\n  box-shadow: inset 0 0 18px rgba(200, 240, 106, 0.11);\n}\n\n.award2-guide[data-tone=\"light\"] .award2-guide__traveler {\n  border-color: rgba(18, 56, 45, 0.31);\n  background: rgba(240, 239, 231, 0.35);\n}\n\n.award2-guide__traveler small,\n.award2-guide[data-tone=\"light\"] .award2-guide__traveler small {\n  top: 64px;\n}\n\n.award2-hero-chat__head .brand-mark {\n  color: #c8f06a !important;\n  animation: award2-chat-mark-chroma 8.5s ease-in-out infinite;\n}\n\n@keyframes award2-chat-mark-chroma {\n  0%, 100% { color: #c8f06a; }\n  28% { color: #79e2b5; }\n  52% { color: #f4f1e0; }\n  76% { color: #66d39d; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .award2-hero-chat__head .brand-mark {\n    animation: none !important;\n    color: #c8f06a !important;\n  }\n}\n`;
            fs.writeFileSync(cssPath, css);
          }

          const testPath = 'tests/home-contract.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('  assert.match(landing, /<BrandMark size=\\{30\\}/);\n', '  assert.match(landing, /award2-guide__lens-core/);\n  assert.doesNotMatch(landing, /<BrandMark size=\\{30\\}/);\n');
          fs.writeFileSync(testPath, test);
          NODE
      - run: npx prettier --write src/components/site/AwardV2Landing.tsx src/components/site/AwardV2Iteration2.css tests/home-contract.test.mjs
      - name: Commit iteration 2e
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/AwardV2Landing.tsx src/components/site/AwardV2Iteration2.css tests/home-contract.test.mjs
          git commit -m "refine: move logo motion from scroll guide to chatbot" || exit 0
          git push origin HEAD:award/rebuild-v2-2026-08-23
