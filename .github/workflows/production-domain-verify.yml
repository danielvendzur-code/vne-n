name: Verify live mojchatbot.sk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-domain-current-main
  cancel-in-progress: true

jobs:
  verify-production-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify current custom-domain release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "=== DNS / routing diagnostics ==="
          getent ahosts mojchatbot.sk || true
          getent ahosts www.mojchatbot.sk || true

          verify_text() {
            local path="$1"
            local expected="$2"
            local body
            body="$(mktemp)"

            for attempt in $(seq 1 30); do
              local stamp="${SOURCE_SHA}-${attempt}-$(date +%s)"
              if curl --location --fail --silent --show-error --max-time 25 \
                --header 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://mojchatbot.sk${path}?verify=${stamp}" -o "${body}"; then
                if grep -Fq "${expected}" "${body}"; then
                  echo "verified ${path}: ${expected}"
                  rm -f "${body}"
                  return 0
                fi
              fi
              sleep 8
            done

            echo "Verification failed for ${path}; expected: ${expected}"
            head -c 2500 "${body}" 2>/dev/null || true
            rm -f "${body}"
            return 1
          }

          verify_text "/" "Z otázky"
          verify_text "/" "Vyskladať kalkulačku"
          verify_text "/widget-loader.js" "round-one-stroke-launcher-20260831-v15"
          verify_text "/kontakt" "Ochrana osobných údajov"
          verify_text "/cookies" "Google Analytics"
          verify_text "/ochrana-udajov" "Venaco s.r.o."
          verify_text "/pravne-informacie" "Venaco s.r.o."
          verify_text "/pravne-informacie" "45648107"
          verify_text "/pravne-informacie" "SK2023076407"
          verify_text "/cennik" "platiteľ DPH"

          echo "LIVE_DOMAIN_VERIFIED=success"
