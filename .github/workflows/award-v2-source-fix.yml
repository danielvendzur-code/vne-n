name: Award v2 source fix

on:
  push:
    branches:
      - award/rebuild-v2-2026-08-23

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: award/rebuild-v2-2026-08-23
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Fix source and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/site/AwardV2Landing.css')
          s = p.read_text()
          s = s.replace('    inset-left: 48%;', '    left: 48%;')
          p.write_text(s)
          PY
          npx prettier --write \
            src/components/site/AwardV2Landing.tsx \
            src/components/site/AwardV2Landing.css \
            src/routes/index.tsx \
            src/routes/cennik.tsx \
            tests/home-contract.test.mjs \
            scripts/security-audit.mjs
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/site/AwardV2Landing.tsx src/components/site/AwardV2Landing.css src/routes/index.tsx src/routes/cennik.tsx tests/home-contract.test.mjs scripts/security-audit.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format and normalize award v2 source"
          git push origin HEAD:award/rebuild-v2-2026-08-23
