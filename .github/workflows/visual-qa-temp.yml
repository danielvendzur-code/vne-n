name: Temporary visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start styled Vite preview
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for attempt in {1..50}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Install browser
        run: bunx playwright@1.55.0 install --with-deps chromium
      - name: Capture desktop and mobile
        run: |
          bunx playwright@1.55.0 screenshot --browser chromium --viewport-size "1600,900" --wait-for-timeout 2500 --full-page http://127.0.0.1:4173/ desktop.png
          bunx playwright@1.55.0 screenshot --browser chromium --viewport-size "390,844" --wait-for-timeout 2500 --full-page http://127.0.0.1:4173/ mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa-styled
          path: |
            desktop.png
            mobile.png
