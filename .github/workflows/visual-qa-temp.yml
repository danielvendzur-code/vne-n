name: Temporary visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:pages
      - name: Start preview
        run: |
          PORT=4173 node .output/server/index.mjs > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:4173/vne-n/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Install browser
        run: bunx playwright@1.55.0 install --with-deps chromium
      - name: Capture desktop and mobile
        run: |
          bunx playwright@1.55.0 screenshot --browser chromium --viewport-size "1600,900" --full-page http://127.0.0.1:4173/vne-n/ desktop.png
          bunx playwright@1.55.0 screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:4173/vne-n/ mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            desktop.png
            mobile.png
