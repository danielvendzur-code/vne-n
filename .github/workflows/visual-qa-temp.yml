name: Temporary visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start styled Vite preview
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for attempt in {1..50}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Install browser and test runner
        run: |
          bunx playwright@1.55.0 install --with-deps chromium
          bun add --no-save --dev @playwright/test@1.55.0
      - name: Capture and inspect styled render
        run: |
          cat > visual-temp.spec.ts <<'EOF'
          import { test } from '@playwright/test';

          const selectors = [
            '.page-transition',
            '.lp-page',
            '.lp-hero',
            '.lp-hero-grid',
            '.lp-hero-copy',
            '.lp-hero-context',
            '.lp-hero-line',
            '.lp-hero-line > span',
            '.lp-hero-stage',
            '.lp-assistant-card',
          ];

          test('desktop', async ({ page }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(5000);
            const info = await page.evaluate((requested) => requested.map((selector) => {
              const element = document.querySelector(selector);
              if (!(element instanceof HTMLElement)) return { selector, missing: true };
              const style = getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return {
                selector,
                opacity: style.opacity,
                visibility: style.visibility,
                display: style.display,
                transform: style.transform,
                animationName: style.animationName,
                color: style.color,
                width: Math.round(rect.width),
                height: Math.round(rect.height),
                top: Math.round(rect.top),
                left: Math.round(rect.left),
              };
            }), selectors);
            console.log(`STYLE_DEBUG=${JSON.stringify(info)}`);
            await page.screenshot({ path: 'desktop.png', fullPage: true });
          });

          test('mobile', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'mobile.png', fullPage: true });
          });
          EOF
          bunx playwright test visual-temp.spec.ts --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa-styled
          path: |
            desktop.png
            mobile.png
