name: Update final style security contract once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/update-security-audit-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Require the intended final style order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/security-audit.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'const finishIndex = layout.indexOf(\'import "./SiteFinish.css"\');\nconst lastStyleImport = layout.lastIndexOf(\'import "./\');',
              'const finishIndex = layout.indexOf(\'import "./SiteFinish.css"\');\nconst teamMotionIndex = layout.indexOf(\'import "./TeamMotionUpgrade.css"\');\nconst lastStyleImport = layout.lastIndexOf(\'import "./\');',
          )
          text = text.replace(
              'if (finishIndex === -1) fail("SiteFinish.css is not imported");',
              'if (finishIndex === -1) fail("SiteFinish.css is not imported");\nif (teamMotionIndex === -1) fail("TeamMotionUpgrade.css is not imported");',
          )
          old = '''// SiteFinish.css je posledná vrstva — dokončuje paletu, prejazdy
// myšou aj opravy hlavičky a menu, takže musí prekryť všetko pred ňou.
if (clientIndex >= finishIndex) {
  fail("SiteFinish.css must load after ClientLandingFinal.css");
}
if (finishIndex !== lastStyleImport) {
  fail("SiteFinish.css must be the final component style import");
}'''
          new = '''// SiteFinish dokončuje historické vrstvy. TeamMotionUpgrade je úzka
// autoritatívna vrstva iba pre nový tímový timeline a scroll systém.
if (clientIndex >= finishIndex) {
  fail("SiteFinish.css must load after ClientLandingFinal.css");
}
if (finishIndex >= teamMotionIndex) {
  fail("TeamMotionUpgrade.css must load after SiteFinish.css");
}
if (teamMotionIndex !== lastStyleImport) {
  fail("TeamMotionUpgrade.css must be the final component style import");
}'''
          if old not in text:
              raise SystemExit('Expected security audit block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node scripts/security-audit.mjs
      - name: Remove this workflow and commit the contract
        shell: bash
        run: |
          rm .github/workflows/update-security-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/security-audit.mjs .github/workflows/update-security-audit-once.yml
          git commit -m 'test: require the final team motion style layer'
          git push origin HEAD:${{ github.head_ref }}
