name: Synchronize Bun lockfile once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/update-bun-lock-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Update and validate Bun lockfile
        run: |
          bun install
          bun install --frozen-lockfile
      - name: Remove this one-off workflow and commit the lockfile
        shell: bash
        run: |
          rm .github/workflows/update-bun-lock-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock .github/workflows/update-bun-lock-once.yml
          git commit -m 'chore: synchronize Bun lockfile with analytics dependencies'
          git push origin HEAD:${{ github.head_ref }}
