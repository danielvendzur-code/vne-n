name: Kage visual QA

on:
  push:
    branches:
      - kage/refinement-2026-08-22
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture browser QA
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/kage-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat /tmp/kage-vite.log; exit 1; fi
          mkdir -p qa-results/kage
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const report = { errors: [], overflows: [], captures: [] };
          const capture = async (page, name, fullPage = false) => {
            await page.screenshot({ path: `qa-results/kage/${name}.png`, fullPage });
            report.captures.push(name);
          };
          const watch = (page) => {
            page.on('pageerror', (error) => report.errors.push(`pageerror: ${error.message}`));
            page.on('console', (message) => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('data-tsd-source') || text.includes('vercel') || text.includes('Content Security Policy')) return;
              report.errors.push(`console: ${text}`);
            });
          };
          const desktop = await browser.newPage({ viewport: { width: 1366, height: 768 }, deviceScaleFactor: 1 });
          watch(desktop);
          await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await desktop.waitForTimeout(900);
          const overflow = await desktop.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          report.overflows.push({ viewport: '1366x768', overflow });
          await capture(desktop, 'desktop-hero');
          await desktop.setViewportSize({ width: 1440, height: 1000 });
          await desktop.reload({ waitUntil: 'networkidle' });
          await desktop.waitForTimeout(700);
          const flowTop = await desktop.locator('.hybrid-flow').evaluate((el) => el.getBoundingClientRect().top + window.scrollY);
          await desktop.evaluate((y) => window.scrollTo({ top: y + window.innerHeight * 1.05, behavior: 'instant' }), flowTop);
          await desktop.waitForTimeout(650);
          await capture(desktop, 'desktop-flow-lens');
          const workTop = await desktop.locator('#realizacie').evaluate((el) => el.getBoundingClientRect().top + window.scrollY);
          await desktop.evaluate((y) => window.scrollTo({ top: y + 100, behavior: 'instant' }), workTop);
          await desktop.waitForTimeout(500);
          await capture(desktop, 'desktop-work-lens');
          const demosTop = await desktop.locator('.kage-demos').evaluate((el) => el.getBoundingClientRect().top + window.scrollY);
          await desktop.evaluate((y) => window.scrollTo({ top: y + 80, behavior: 'instant' }), demosTop);
          await desktop.waitForTimeout(1500);
          await capture(desktop, 'desktop-live-demos');
          await capture(desktop, 'desktop-full', true);

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
          watch(mobile);
          await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await mobile.waitForTimeout(700);
          const mobileOverflow = await mobile.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          report.overflows.push({ viewport: '390x844', overflow: mobileOverflow });
          await capture(mobile, 'mobile-hero');
          const mobileDemosTop = await mobile.locator('.kage-demos').evaluate((el) => el.getBoundingClientRect().top + window.scrollY);
          await mobile.evaluate((y) => window.scrollTo({ top: y + 20, behavior: 'instant' }), mobileDemosTop);
          await mobile.waitForTimeout(1200);
          await capture(mobile, 'mobile-live-demos');
          fs.writeFileSync('qa-results/kage/report.json', JSON.stringify(report, null, 2));
          if (report.overflows.some((entry) => entry.overflow > 1)) throw new Error(`Horizontal overflow: ${JSON.stringify(report.overflows)}`);
          if (report.errors.length) throw new Error(`Browser errors: ${report.errors.join('\n')}`);
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kage-visual-qa
          path: qa-results/kage
