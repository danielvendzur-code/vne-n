name: Temporary green interaction visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright@1.55.0 install --with-deps chromium

      - name: Start Vite
        run: |
          bun run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1

      - name: Capture desktop and mobile
        run: |
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const targets = [
            { name: 'desktop', width: 1600, height: 1000, mobile: false },
            { name: 'mobile', width: 390, height: 844, mobile: true },
          ];

          await fs.mkdir('visual-green-interactions', { recursive: true });
          for (const target of targets) {
            const context = await browser.newContext({
              viewport: { width: target.width, height: target.height },
              deviceScaleFactor: 1,
              isMobile: target.mobile,
              hasTouch: target.mobile,
              reducedMotion: 'no-preference',
            });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1800);
            await page.screenshot({
              path: `visual-green-interactions/${target.name}-top.png`,
              fullPage: false,
            });

            const primary = page.locator('.lp-hero-cta--primary').first();
            if (await primary.count()) {
              await primary.hover();
              await page.waitForTimeout(650);
              await page.screenshot({
                path: `visual-green-interactions/${target.name}-hover.png`,
                fullPage: false,
              });
            }

            const sections = ['#pripadova-studia', '#realizacie', '#moznosti', '#otazky', '#spolupraca'];
            for (const section of sections) {
              const element = page.locator(section).first();
              if (!(await element.count())) continue;
              await element.scrollIntoViewIfNeeded();
              await page.waitForTimeout(650);
            }
            await page.screenshot({
              path: `visual-green-interactions/${target.name}-full.png`,
              fullPage: true,
            });
            await context.close();
          }
          await browser.close();
          EOF
          bunx --package playwright@1.55.0 node /tmp/capture.mjs

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: green-interaction-visual-qa
          path: visual-green-interactions
          retention-days: 7
