name: One-shot competition formatter

on:
  push:
    branches:
      - competition/award-pass-2026-08-23

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: competition/award-pass-2026-08-23
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/site/CompetitionLanding.tsx src/components/site/CompetitionLanding.css src/routes/index.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/CompetitionLanding.tsx src/components/site/CompetitionLanding.css src/routes/index.tsx
          git commit -m "Format competition homepage"
          git push origin HEAD:competition/award-pass-2026-08-23
