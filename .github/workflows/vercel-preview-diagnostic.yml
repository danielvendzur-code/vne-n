name: Vercel preview diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/vercel-preview-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_ID: 8FtGCFYk4qquA65rHTzYD7toei8T
      TEAM_ID: team_xJCHkDHUMXQ0lqpImtY3Fbvr
      PROJECT_ID: prj_S3AOfuRcslv6LBeL9KkJ4scx2LYv
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci

      - name: Simulate the default project build command
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee npm-build.log

      - name: Simulate the explicit Vercel Nitro build
        shell: bash
        run: |
          set -o pipefail
          npm run build:vercel 2>&1 | tee vercel-preset-build.log

      - name: Request deployment metadata and build events
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          echo "token_configured=$([ -n "$VERCEL_TOKEN" ] && echo yes || echo no)" > diagnostic/context.txt
          echo "deployment=$DEPLOYMENT_ID" >> diagnostic/context.txt
          echo "project=$PROJECT_ID" >> diagnostic/context.txt
          echo "team=$TEAM_ID" >> diagnostic/context.txt

          auth=()
          if [ -n "$VERCEL_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          fi

          curl -sS -D diagnostic/deployment-headers.txt \
            "${auth[@]}" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$TEAM_ID" \
            -o diagnostic/deployment.json

          curl -sS -D diagnostic/events-headers.txt \
            "${auth[@]}" \
            "https://api.vercel.com/v3/deployments/$DEPLOYMENT_ID/events?teamId=$TEAM_ID&direction=backward&limit=100" \
            -o diagnostic/events.json

          cp npm-build.log vercel-preset-build.log diagnostic/
          echo '=== context ==='
          cat diagnostic/context.txt
          echo '=== deployment response ==='
          cat diagnostic/deployment.json
          echo
          echo '=== events response ==='
          cat diagnostic/events.json
          echo

      - uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-diagnostic
          path: diagnostic
          retention-days: 1
