name: Finalize lime white brand once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finalize-lime-white-brand-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply final contracts, metadata and brand assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # Security contract: preserve the historical order and require the new
          # narrow brand layer to be the only final authority.
          path = Path('scripts/security-audit.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "const teamMotionIndex = layout.indexOf('import \"./TeamMotionUpgrade.css\"');\nconst lastStyleImport = layout.lastIndexOf('import \"./');",
              "const teamMotionIndex = layout.indexOf('import \"./TeamMotionUpgrade.css\"');\nconst limeWhiteIndex = layout.indexOf('import \"./LimeWhiteBrandFinal.css\"');\nconst lastStyleImport = layout.lastIndexOf('import \"./');",
          )
          text = text.replace(
              'if (teamMotionIndex === -1) fail("TeamMotionUpgrade.css is not imported");',
              'if (teamMotionIndex === -1) fail("TeamMotionUpgrade.css is not imported");\nif (limeWhiteIndex === -1) fail("LimeWhiteBrandFinal.css is not imported");',
          )
          old = '''if (finishIndex >= teamMotionIndex) {
  fail("TeamMotionUpgrade.css must load after SiteFinish.css");
}
if (teamMotionIndex !== lastStyleImport) {
  fail("TeamMotionUpgrade.css must be the final component style import");
}'''
          new = '''if (finishIndex >= teamMotionIndex) {
  fail("TeamMotionUpgrade.css must load after SiteFinish.css");
}
if (teamMotionIndex >= limeWhiteIndex) {
  fail("LimeWhiteBrandFinal.css must load after TeamMotionUpgrade.css");
}
if (limeWhiteIndex !== lastStyleImport) {
  fail("LimeWhiteBrandFinal.css must be the final component style import");
}'''
          if old not in text:
              raise SystemExit('Security style-order block was not found')
          text = text.replace(old, new)
          marker = 'const winnerCss = await read("src/components/site/CompetitionWinnerFinal.css");'
          addition = '''const limeWhiteCss = await read("src/components/site/LimeWhiteBrandFinal.css");
for (const token of [
  "--brand-primary: #b9ed4d",
  "--brand-forest: #0b2f20",
  "--brand-yellow: #ffe38a",
  "html body .brand-mark",
  ".lp-hero-pick",
  ".lp-process",
  "prefers-reduced-motion",
]) {
  if (!limeWhiteCss.includes(token)) fail(`Lime white brand system is missing ${token}`);
}
if (!/background:\s*#ffffff\s*!important/.test(limeWhiteCss)) {
  fail("Lime white brand system does not preserve a true-white base");
}

'''
          if marker not in text:
              raise SystemExit('Security insertion marker not found')
          text = text.replace(marker, addition + marker)
          path.write_text(text, encoding='utf-8')

          # UX contracts: the new brand layer is final, and its interaction
          # language is protected without deleting historical tests.
          path = Path('tests/home-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "// The client landing layer is the final visual authority.",
              "// Historical layers retain their order; the approved lime-white layer is final.",
          )
          text = text.replace(
              '''  assert.equal(
    layout.lastIndexOf('import "./'),
    layout.indexOf('import "./TeamMotionUpgrade.css"'),
  );''',
              '''  assert.ok(
    layout.indexOf('import "./TeamMotionUpgrade.css"') <
      layout.indexOf('import "./LimeWhiteBrandFinal.css"'),
  );
  assert.equal(
    layout.lastIndexOf('import "./'),
    layout.indexOf('import "./LimeWhiteBrandFinal.css"'),
  );''',
          )
          text += r'''

test("the white forest lime system is the final brand authority", async () => {
  const layout = await read("src/components/site/Layout.tsx");
  const css = await read("src/components/site/LimeWhiteBrandFinal.css");
  const mark = await read("src/components/BrandMark.tsx");

  assert.match(layout, /LimeWhiteBrandFinal\.css/);
  assert.match(css, /--brand-primary: #b9ed4d/);
  assert.match(css, /--brand-forest: #0b2f20/);
  assert.match(css, /--brand-yellow: #ffe38a/);
  assert.match(css, /background:\s*#ffffff\s*!important/);
  assert.match(css, /\.lp-hero-pick[\s\S]*background: #d9ff78 !important/);
  assert.match(css, /data-active="true"[\s\S]*background: #0b2f20 !important/);
  assert.match(mark, /viewBox="0 0 112 112"/);
  assert.match(mark, /translate\(112 0\) scale\(-1 1\)/);
  assert.match(mark, /strokeWidth="9"/);
});
'''
          path.write_text(text, encoding='utf-8')

          # Team-first navigation and the new menu accent.
          replace('src/components/site/Nav.tsx', 'accentColor="#ffc79d"', 'accentColor="#d9ff78"')
          replace(
              'src/components/site/Nav.tsx',
              'Pozrieť živé weby, ktoré som robil',
              'Pozrieť živé weby tímu Môj Chatbot',
          )

          # Browser chrome and error routes must not flash the old dark palette.
          path = Path('src/routes/__root.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'border: "1px solid rgba(255,199,157,.2)"': 'border: "1px solid rgba(11,47,32,.14)"',
              'background: "#12100e"': 'background: "#ffffff"',
              'boxShadow: "0 30px 90px rgba(0,0,0,.58)"': 'boxShadow: "0 30px 90px -54px rgba(11,47,32,.48)"',
              'backgroundColor: "#0a0908"': 'backgroundColor: "#ffffff"',
              'rgba(255,199,157,.11)': 'rgba(217,255,120,.3)',
              'color: "#ffc79d"': 'color: "#19834f"',
              'color: "#faf5ef"': 'color: "#0b2f20"',
              'color: "#c9beb4"': 'color: "#536159"',
              'backgroundColor: "#ffc79d"': 'backgroundColor: "#d9ff78"',
              'color: "#0a0908"': 'color: "#0b2f20"',
              'border: "1px solid #ffc79d"': 'border: "1px solid rgba(127,178,26,.3)"',
              'rgba(255,199,157,.9)': 'rgba(86,132,0,.55)',
              'border: "1px solid rgba(255,199,157,.2)"': 'border: "1px solid rgba(11,47,32,.16)"',
              'background: "#15120f"': 'background: "#f5f9f2"',
              'https://danielvendzur-code.github.io/moj.chatbot.backend/embed.js': 'https://danielvendzur-code.github.io/moj.chatbot.backend/widget.js',
              '{ name: "theme-color", content: "#0a0908" }': '{ name: "theme-color", content: "#ffffff" }',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # Production assets reuse the exact same corrected geometry.
          mark = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-label="Môj Chatbot">
  <title>Môj Chatbot</title>
  <g transform="translate(112 0) scale(-1 1)" fill="none" stroke="#B9ED4D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 19V71.5C8 81.2 15.8 89 25.5 89H43L59 104V89H79.5C89.2 89 97 81.2 97 71.5V19C97 11.4 87.8 7.6 82.5 13L61 34.8C56.2 39.7 48.4 39.7 43.6 34.8L22.5 13C17.2 7.6 8 11.4 8 19Z"/>
    <path d="M29 68V42L45.1 58.1C49 62 55.2 62 59.1 58.1L75 42V68"/>
  </g>
</svg>
'''
          Path('public/brand/logo.svg').write_text(mark, encoding='utf-8')
          Path('public/brand/mark-lime.svg').write_text(mark, encoding='utf-8')
          Path('public/favicon.svg').write_text(mark, encoding='utf-8')
          PY

      - name: Install and format
        run: |
          bun install --frozen-lockfile
          bunx prettier --write \
            scripts/security-audit.mjs \
            tests/home-contract.test.mjs \
            src/components/site/Nav.tsx \
            src/routes/__root.tsx \
            src/components/BrandMark.tsx \
            src/components/site/LimeWhiteBrandFinal.css \
            public/brand/logo.svg \
            public/brand/mark-lime.svg \
            public/favicon.svg

      - name: Validate complete website
        run: |
          node scripts/security-audit.mjs
          bun test
          bun run lint
          bun run build

      - name: Commit validated changes and remove helper
        shell: bash
        run: |
          rm .github/workflows/finalize-lime-white-brand-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: protect the final lime white brand system'
          git push origin HEAD:${{ github.head_ref }}
