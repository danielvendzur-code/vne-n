name: One-shot final Kage flow fix

on:
  push:
    branches:
      - kage/refinement-2026-08-22

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kage/refinement-2026-08-22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --no-save playwright@1.55.0 sharp@0.34.3
      - run: npx playwright install --with-deps chromium
      - name: Capture clean APLAN preview
        run: |
          mkdir -p public/work/live
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          await page.goto('https://danielvendzur-code.github.io/aplan-chatbot-backend/', { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForTimeout(1800);
          await page.evaluate(() => {
            window.scrollTo(0, 0);
            for (const el of document.querySelectorAll('*')) {
              if (!(el instanceof HTMLElement)) continue;
              const style = getComputedStyle(el);
              const rect = el.getBoundingClientRect();
              if (style.position === 'fixed' && rect.top > innerHeight * 0.62 && rect.width < 560) {
                el.style.setProperty('visibility', 'hidden', 'important');
              }
            }
          });
          await page.waitForTimeout(250);
          await page.screenshot({ path: '/tmp/aplan.png', fullPage: false });
          await sharp('/tmp/aplan.png')
            .extract({ left: 0, top: 0, width: 1600, height: 900 })
            .webp({ quality: 90 })
            .toFile('public/work/live/aplan.webp');
          await browser.close();
          NODE
      - name: Shorten flow transitions and use captured APLAN image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/site/KageLanding.tsx')
          s=p.read_text()
          s=s.replace('/* eslint-disable prettier/prettier */\n','')
          old='''    [0, 0.16, 0.3, 0.43, 0.57, 0.7, 0.84, 1],\n    ["0%", "0%", "-25%", "-25%", "-50%", "-50%", "-75%", "-75%"],'''
          new='''    [0, 0.21, 0.27, 0.45, 0.51, 0.69, 0.75, 1],\n    ["0%", "0%", "-25%", "-25%", "-50%", "-50%", "-75%", "-75%"],'''
          if old not in s: raise SystemExit('flow map not found')
          s=s.replace(old,new)
          pattern=re.compile(r'''            <iframe\n              src="https://danielvendzur-code.github.io/aplan-chatbot-backend/"\n              title="APLAN AI živá ukážka"\n              loading="lazy"\n              tabIndex=\{-1\}\n            />''')
          replacement='''            <img\n              src={`${import.meta.env.BASE_URL}work/live/aplan.webp`}\n              alt="APLAN AI interaktívny asistent"\n              loading="lazy"\n              decoding="async"\n            />'''
          s,count=pattern.subn(replacement,s)
          if count != 1: raise SystemExit(f'aplan iframe replacement={count}')
          p.write_text(s)
          PY
          bunx prettier --write src/components/site/KageLanding.tsx src/components/site/KageLanding.css
      - name: Verify final source
        run: |
          bun run lint
          bun run test
          bun run build
      - name: Commit final source and remove one-shot runner
        run: |
          rm .github/workflows/one-shot-kage-flow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Kage-inspired flow and APLAN preview"
          git push origin HEAD:kage/refinement-2026-08-22
