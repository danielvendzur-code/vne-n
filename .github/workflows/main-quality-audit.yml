name: Main quality audit

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-quality
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip main-quality]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile > /tmp/install.log 2>&1

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint > /tmp/lint.log 2>&1

      - name: Contract tests
        id: test
        continue-on-error: true
        run: bun run test > /tmp/test.log 2>&1

      - name: Production build
        id: build
        continue-on-error: true
        env:
          NITRO_PRESET: node-server
        run: bun run build > /tmp/build.log 2>&1

      - name: Save result
        if: always()
        shell: bash
        run: |
          {
            echo "run_id=${{ github.run_id }}"
            echo "install=${{ steps.install.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo
            echo "===== lint ====="
            cat /tmp/lint.log 2>/dev/null || true
            echo
            echo "===== test ====="
            cat /tmp/test.log 2>/dev/null || true
            echo
            echo "===== build ====="
            cat /tmp/build.log 2>/dev/null || true
          } > MAIN_QUALITY_AUDIT.txt

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-quality-${{ github.run_id }}
          path: MAIN_QUALITY_AUDIT.txt
          retention-days: 14

      - name: Enforce quality result
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
