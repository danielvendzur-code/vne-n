# trigger
name: One-shot Kage-inspired refinement

on:
  push:
    branches:
      - kage/refinement-2026-08-22
    paths:
      - .github/workflows/one-shot-kage-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kage/refinement-2026-08-22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --no-save playwright@1.55.0 sharp@0.34.3
      - run: npx playwright install --with-deps chromium
      - name: Capture APLAN live preview
        run: |
          mkdir -p public/work/live
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import sharp from 'sharp';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          await page.goto('https://danielvendzur-code.github.io/aplan-chatbot-backend/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(3200);
          await page.evaluate(() => {
            window.scrollTo(0, 0);
            for (const el of document.querySelectorAll('*')) {
              if (!(el instanceof HTMLElement)) continue;
              const style = getComputedStyle(el);
              const rect = el.getBoundingClientRect();
              if (style.position === 'fixed' && rect.top > window.innerHeight * 0.62 && rect.width < 520) {
                el.style.setProperty('visibility', 'hidden', 'important');
              }
            }
          });
          await page.waitForTimeout(250);
          await page.screenshot({ path: '/tmp/aplan.png', fullPage: false });
          await sharp('/tmp/aplan.png').extract({ left: 0, top: 0, width: 1600, height: 900 }).webp({ quality: 90 }).toFile('public/work/live/aplan.webp');
          await browser.close();
          NODE
      - name: Apply reference-driven source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/site/PremiumLanding.tsx')
          s = p.read_text()
          s = s.replace('import "./AwardHome.css";\n', 'import "./AwardHome.css";\nimport "./KageRefinement.css";\n')

          signal = r'''const signalSections = [
  { index: "01", label: "Úvod", threshold: 0.12, tone: "dark" },
  { index: "02", label: "Možnosti", threshold: 0.27, tone: "light" },
  { index: "03", label: "Ako to funguje", threshold: 0.49, tone: "dark" },
  { index: "04", label: "Realizácie", threshold: 0.66, tone: "light" },
  { index: "05", label: "Riešenia", threshold: 0.84, tone: "light" },
  { index: "06", label: "Kontakt", threshold: 1.01, tone: "dark" },
] as const;

const liveDemos = [
  {
    name: "WEBKO",
    type: "Webová realizácia",
    href: "https://www.webko.sk/",
    image: `${import.meta.env.BASE_URL}work/live/webko.webp`,
    copy: "Otvorte si živý web a pozrite si jeho typografiu, pohyb a cestu ku kontaktu.",
  },
  {
    name: "APLAN AI",
    type: "Interaktívny AI asistent",
    href: "https://danielvendzur-code.github.io/aplan-chatbot-backend/",
    image: `${import.meta.env.BASE_URL}work/live/aplan.webp`,
    copy: "Vyskúšajte si asistenta, ktorý návštevníka prevedie tým, čo potrebuje vybaviť.",
  },
] as const;
'''
          s = s.replace('function HeroCollage() {', signal + '\nfunction HeroCollage() {')

          signal_component = r'''function SignalLens() {
  const { scrollYProgress } = useScroll();
  const progress = useSpring(scrollYProgress, { stiffness: 96, damping: 27, mass: 0.28 });
  const lensY = useTransform(progress, [0, 1], ["0vh", "61vh"]);
  const lensOpacity = useTransform(progress, [0, 0.035, 0.075, 0.97, 1], [0, 0, 1, 1, 0.45]);
  const pointerX = useMotionValue(0);
  const pointerY = useMotionValue(0);
  const tiltX = useSpring(pointerY, { stiffness: 210, damping: 24 });
  const tiltY = useSpring(pointerX, { stiffness: 210, damping: 24 });
  const [activeSection, setActiveSection] = useState(0);

  useMotionValueEvent(scrollYProgress, "change", (value) => {
    const next = signalSections.findIndex((section) => value < section.threshold);
    setActiveSection(next === -1 ? signalSections.length - 1 : next);
  });

  useEffect(() => {
    const onPointerMove = (event: PointerEvent) => {
      const x = (event.clientX / window.innerWidth - 0.5) * 12;
      const y = (event.clientY / window.innerHeight - 0.5) * -8;
      pointerX.set(Math.max(-6, Math.min(6, x)));
      pointerY.set(Math.max(-4, Math.min(4, y)));
    };
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    return () => window.removeEventListener("pointermove", onPointerMove);
  }, [pointerX, pointerY]);

  const chapter = signalSections[activeSection];
  return (
    <aside className="signal-rail" data-tone={chapter.tone} aria-hidden="true">
      <span className="signal-rail__chapter">{chapter.index}</span>
      <div className="signal-rail__line">
        {signalSections.map((section, index) => (
          <i key={section.index} data-active={index <= activeSection || undefined} />
        ))}
      </div>
      <motion.div className="signal-lens" data-tone={chapter.tone} style={{ y: lensY, opacity: lensOpacity, rotateX: tiltX, rotateY: tiltY }}>
        <span className="signal-lens__wash" />
        <BrandMark size={31} />
        <small>{chapter.label}</small>
      </motion.div>
    </aside>
  );
}'''
          s, count = re.subn(r'function PageGuide\(\) \{.*?\n\}\n\nfunction FlowStory\(\)', signal_component + '\n\nfunction FlowStory()', s, flags=re.S)
          if count != 1: raise SystemExit(f'PageGuide replacement count={count}')

          live_component = r'''function LiveDemos() {
  return (
    <section className="hybrid-demos" aria-labelledby="hybrid-demos-title">
      <div className="container-page hybrid-demos__intro">
        <span>ŽIVÉ UKÁŽKY</span>
        <h2 id="hybrid-demos-title">Otvorte si ich. Klikajte.</h2>
        <p>Nie sú to statické mockupy. Obe ukážky môžete otvoriť a reálne si ich prejsť.</p>
      </div>
      <div className="container-page hybrid-demos__grid">
        {liveDemos.map((demo, index) => (
          <a key={demo.name} href={demo.href} target="_blank" rel="noreferrer" className="hybrid-demo">
            <div className="hybrid-demo__visual">
              <img src={demo.image} alt={`Ukážka projektu ${demo.name}`} loading="lazy" decoding="async" />
              <span>0{index + 1}</span>
              <b>VYSKÚŠAŤ <ArrowUpRight size={16} /></b>
            </div>
            <div className="hybrid-demo__meta">
              <div><strong>{demo.name}</strong><span>{demo.type}</span></div>
              <p>{demo.copy}</p>
            </div>
          </a>
        ))}
      </div>
    </section>
  );
}
'''
          s = s.replace('function CoreTools() {', live_component + '\nfunction CoreTools() {')
          s = s.replace('<PageGuide />', '<SignalLens />')

          old_bottom = re.compile(r'''        <div className="container-page hybrid-hero__bottom">.*?        </div>\n\n        <div className="container-page hybrid-hero__capabilities" aria-label="Typy riešení">.*?        </div>''', re.S)
          new_bottom = '''        <div className="container-page hybrid-hero__bottom">
          <p className="hybrid-hero__shortline">Chatboty · Kalkulačky · Konfigurátory · Produktoví poradcovia</p>
          <div className="hybrid-hero__actions">
            <a href="#realizacie" className="hybrid-hero__primary">Pozrieť realizácie <ArrowUpRight size={17} /></a>
          </div>
        </div>'''
          s, count = old_bottom.subn(new_bottom, s)
          if count != 1: raise SystemExit(f'hero bottom replacement count={count}')
          s = s.replace('      <SelectedWork />\n      <CoreTools />', '      <SelectedWork />\n      <LiveDemos />\n      <CoreTools />')
          p.write_text(s)

          Path('src/components/site/KageRefinement.css').write_text(r'''/* Kage-inspired refinement: original implementation, reference-driven motion only. */
.signal-rail{position:fixed;top:14vh;right:1.1rem;z-index:54;width:72px;height:72vh;perspective:560px;pointer-events:none;color:#071b15}
.signal-rail__chapter{position:absolute;top:-1.55rem;right:7px;color:rgba(7,27,21,.58);font:650 .58rem/1 var(--font-mono);letter-spacing:.08em}
.signal-rail__line{position:absolute;top:0;bottom:0;right:27px;width:1px;background:linear-gradient(to bottom,rgba(7,27,21,.08),rgba(7,27,21,.34),rgba(7,27,21,.08))}
.signal-rail__line i{position:absolute;right:-3px;width:7px;height:7px;border:1px solid rgba(7,27,21,.28);border-radius:50%;background:#f0efe7;transition:background 260ms ease,border-color 260ms ease,transform 360ms cubic-bezier(.16,1,.3,1)}
.signal-rail__line i:nth-child(1){top:0}.signal-rail__line i:nth-child(2){top:20%}.signal-rail__line i:nth-child(3){top:40%}.signal-rail__line i:nth-child(4){top:60%}.signal-rail__line i:nth-child(5){top:80%}.signal-rail__line i:nth-child(6){top:calc(100% - 7px)}
.signal-rail__line i[data-active="true"]{border-color:#12382d;background:#c8f06a;transform:scale(1.2)}
.signal-lens{position:absolute;top:0;right:0;width:64px;height:78px;display:grid;place-items:center;overflow:visible;border:1px solid rgba(200,240,106,.72);border-radius:46% 54% 44% 56%/40% 44% 56% 60%;background:rgba(200,240,106,.18);-webkit-backdrop-filter:blur(12px) saturate(1.28);backdrop-filter:blur(12px) saturate(1.28);color:#c8f06a;box-shadow:0 18px 42px -30px rgba(7,27,21,.72);transform-style:preserve-3d;will-change:transform}
.signal-lens[data-tone="light"]{border-color:rgba(7,27,21,.32);background:rgba(7,27,21,.12);color:#12382d}
.signal-lens__wash{position:absolute;inset:7px;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.2),transparent 52%,rgba(200,240,106,.18));pointer-events:none}
.signal-lens .brand-mark{position:relative;z-index:2;filter:drop-shadow(0 4px 12px rgba(7,27,21,.12))}
.signal-lens small{position:absolute;right:73px;top:50%;width:max-content;padding:.38rem .48rem;border:1px solid rgba(7,27,21,.14);background:rgba(240,239,231,.86);color:#12382d;font:650 .56rem/1 var(--font-mono);letter-spacing:.05em;transform:translateY(-50%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hybrid-hero{grid-template-rows:minmax(0,1fr) auto}.hybrid-hero__stage{min-height:calc(100svh - var(--header-h) - 82px)}
.hybrid-hero__bottom{min-height:82px;grid-template-columns:minmax(0,1fr) auto}.hybrid-hero__shortline,.hybrid-hero__bottom>p.hybrid-hero__shortline{max-width:none;margin:0;color:#9da8a0;font:600 .62rem/1.25 var(--font-mono);letter-spacing:.055em}.hybrid-hero__primary{min-height:46px;padding-inline:1rem}
.hybrid-flow__copy p{color:#d1d8d3}.hybrid-flow__copy>span,.hybrid-flow__artifact>span{color:#acb6af}.hybrid-manifesto span,.hybrid-work__intro>span,.hybrid-tools__intro>span,.hybrid-process__intro>span,.hybrid-price__top>span{color:#444c46}.hybrid-project__meta div p,.hybrid-project__meta>p,.hybrid-tools__intro p,.hybrid-process__list p{color:#4e5650}.hybrid-audience p{opacity:.94}
.hybrid-demos{padding:clamp(6.5rem,9vw,9rem) 0;background:#0a221b;color:#f6f5ee}.hybrid-demos__intro{display:grid;grid-template-columns:.28fr minmax(0,1fr) minmax(16rem,.42fr);gap:2rem;align-items:end;margin-bottom:clamp(3.5rem,5vw,5rem)}.hybrid-demos__intro>span{color:#9eaaa2;font:650 .62rem/1.2 var(--font-mono);letter-spacing:.08em}.hybrid-demos__intro h2{max-width:8.5ch;margin:0;color:#f6f5ee;font-size:clamp(3.7rem,6.2vw,6.9rem);font-weight:470;line-height:.9;letter-spacing:-.058em}.hybrid-demos__intro p{max-width:25rem;margin:0 0 .35rem;color:#bdc7c0;font-size:.96rem;line-height:1.55}.hybrid-demos__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(1.5rem,3vw,3rem)}.hybrid-demo{min-width:0;display:block;color:inherit}.hybrid-demo__visual{position:relative;overflow:hidden;aspect-ratio:16/9;border:1px solid rgba(246,245,238,.16);background:#071b15}.hybrid-demo__visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:top center;transition:transform 900ms cubic-bezier(.16,1,.3,1),filter 500ms ease}.hybrid-demo__visual::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,27,21,.55),transparent 45%);pointer-events:none}.hybrid-demo__visual>span,.hybrid-demo__visual>b{position:absolute;z-index:2;bottom:.9rem;font:650 .6rem/1 var(--font-mono);letter-spacing:.065em}.hybrid-demo__visual>span{left:.9rem;color:#d5ddd7}.hybrid-demo__visual>b{right:.9rem;display:inline-flex;align-items:center;gap:.38rem;color:#c8f06a}.hybrid-demo:hover .hybrid-demo__visual img{transform:scale(1.022);filter:saturate(1.04) contrast(1.02)}.hybrid-demo__meta{display:grid;grid-template-columns:minmax(0,.65fr) minmax(0,1fr);gap:1.5rem;padding-top:1rem}.hybrid-demo__meta strong{display:block;margin-bottom:.22rem;color:#f6f5ee;font-family:var(--font-display);font-size:clamp(2.2rem,3.4vw,3.7rem);font-weight:520;line-height:.92;letter-spacing:-.05em}.hybrid-demo__meta span{color:#9eaaa2;font-size:.78rem}.hybrid-demo__meta p{max-width:29rem;margin:0;color:#c4cec7;font-size:.88rem;line-height:1.52}
@media(max-width:1180px),(pointer:coarse){.signal-rail{display:none}}@media(max-width:720px){.hybrid-hero__stage{min-height:72svh}.hybrid-hero__bottom{min-height:72px;grid-template-columns:1fr;gap:.9rem;padding-top:1rem;padding-bottom:1rem}.hybrid-hero__shortline,.hybrid-hero__bottom>p.hybrid-hero__shortline{font-size:.56rem;line-height:1.35}.hybrid-demos{padding:5.6rem 0}.hybrid-demos__intro{grid-template-columns:1fr;gap:1.35rem}.hybrid-demos__intro h2{font-size:clamp(3rem,13.8vw,5rem)}.hybrid-demos__grid{grid-template-columns:1fr;gap:3.8rem}.hybrid-demo__meta{grid-template-columns:1fr;gap:.85rem}}@media(prefers-reduced-motion:reduce){.signal-rail{display:none}.hybrid-demo__visual img{transition:none}}
''')

          t = Path('tests/home-contract.test.mjs'); ts = t.read_text()
          ts = ts.replace('assert.match(landing, /Chatbot, kalkulačka, konfigurátor alebo produktový poradca/i);','assert.match(landing, /Chatboty · Kalkulačky · Konfigurátory · Produktoví poradcovia/i);')
          ts = ts.replace('assert.match(landing, /PageGuide/);','assert.match(landing, /SignalLens/);')
          ts = ts.replace('assert.match(css, /\\.page-guide/);','assert.match(landing, /KageRefinement\\.css/);')
          ts = ts.replace('  assert.match(css, /@media \\(max-width: 720px\\)/);\n','  assert.match(css, /@media \\(max-width: 720px\\)/);\n  const refinement = await read("src/components/site/KageRefinement.css");\n  assert.match(landing, /APLAN AI/);\n  assert.match(landing, /WEBKO/);\n  assert.match(refinement, /\\.signal-lens/);\n  assert.match(refinement, /backdrop-filter:\\s*blur\\(/i);\n  assert.match(refinement, /pointer:\\s*coarse/);\n')
          t.write_text(ts)
          c=Path('src/config/site.ts'); cs=c.read_text().replace('question-to-outcome-20260822-v5','question-to-outcome-20260822-kage-v1').replace('question-to-outcome-20260822-v4','question-to-outcome-20260822-kage-v1'); c.write_text(cs)
          PY
          bunx prettier --write src/components/site/PremiumLanding.tsx src/components/site/KageRefinement.css tests/home-contract.test.mjs src/config/site.ts
      - name: Verify implementation
        run: |
          bun run test
          bun run lint
          bun run build
      - name: Commit refinement and remove runner
        run: |
          rm .github/workflows/one-shot-kage-refinement.yml
          git config user.name "danielvendzur-code"
          git config user.email "daniel.vendzur@gmail.com"
          git add -A
          git commit -m "Refine Môj Chatbot with Kage-inspired scroll storytelling"
          git push origin HEAD:kage/refinement-2026-08-22
