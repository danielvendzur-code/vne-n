name: Competition visual QA

on:
  push:
    branches:
      - competition/award-pass-2026-08-23
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture competition homepage
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/competition-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat /tmp/competition-vite.log; exit 1; fi
          mkdir -p qa-results/competition
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const report = { errors: [], overflows: [], captures: [] };
          const watch = (page) => {
            page.on('pageerror', e => report.errors.push(`pageerror: ${e.message}`));
            page.on('console', m => {
              if (m.type() !== 'error') return;
              const t = m.text();
              if (/Content Security Policy|data-tsd-source|vercel|404/i.test(t)) return;
              report.errors.push(`console: ${t}`);
            });
          };
          const shot = async (page, name, fullPage=false) => {
            await page.screenshot({ path:`qa-results/competition/${name}.png`, fullPage });
            report.captures.push(name);
          };
          const desktop = await browser.newPage({ viewport:{width:1366,height:768} });
          watch(desktop);
          await desktop.goto('http://127.0.0.1:4173/', { waitUntil:'networkidle' });
          await desktop.waitForTimeout(900);
          report.overflows.push({ viewport:'1366x768', overflow:await desktop.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth) });
          await shot(desktop,'desktop-hero');
          for (const [selector,name,offset] of [
            ['#riesenia','desktop-solutions',70],
            ['#realizacie','desktop-work',70],
            ['#ako-to-funguje','desktop-flow',820],
            ['#ukazky','desktop-demos',70],
            ['#cena','desktop-price',60]
          ]) {
            const top = await desktop.locator(selector).evaluate(el=>el.getBoundingClientRect().top+window.scrollY);
            await desktop.evaluate(([y,o])=>window.scrollTo({top:y+o,behavior:'instant'}),[top,offset]);
            await desktop.waitForTimeout(650);
            await shot(desktop,name);
          }
          await shot(desktop,'desktop-full',true);
          const mobile = await browser.newPage({ viewport:{width:390,height:844}, isMobile:true, hasTouch:true });
          watch(mobile);
          await mobile.goto('http://127.0.0.1:4173/', { waitUntil:'networkidle' });
          await mobile.waitForTimeout(700);
          report.overflows.push({ viewport:'390x844', overflow:await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth) });
          await shot(mobile,'mobile-hero');
          for (const [selector,name] of [['#riesenia','mobile-solutions'],['#realizacie','mobile-work'],['#ukazky','mobile-demos']]) {
            await mobile.locator(selector).scrollIntoViewIfNeeded();
            await mobile.waitForTimeout(500);
            await shot(mobile,name);
          }
          fs.writeFileSync('qa-results/competition/report.json', JSON.stringify(report,null,2));
          if (report.overflows.some(x=>x.overflow>1)) throw new Error(`Horizontal overflow ${JSON.stringify(report.overflows)}`);
          if (report.errors.length) throw new Error(report.errors.join('\n'));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competition-visual-qa
          path: qa-results/competition
